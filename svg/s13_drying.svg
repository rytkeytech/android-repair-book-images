<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1a2b" flood-opacity=".25"/></filter>
<marker id="a0D2847" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0D2847"/></marker><marker id="aE65100" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E65100"/></marker><marker id="a1565C0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1565C0"/></marker><marker id="a2E7D32" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aC62828" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C62828"/></marker><marker id="a6A1B9A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6A1B9A"/></marker><marker id="a00796B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00796B"/></marker><marker id="a546E7A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#546E7A"/></marker><marker id="a1d1d1f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f"/></marker><marker id="aff5722" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5722"/></marker><marker id="affffff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="420" fill="#fff"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Drying properly before power</text>
<text x="40" y="84" font-size="17" fill="#55657a">Powering a board that is still wet can burn the parts you just cleaned.</text>
<rect x="40" y="120" width="360" height="240" rx="18" fill="#fff" stroke="#a5d6a7" stroke-width="2" opacity="1" filter="url(#sh)"/>
<circle cx="220" cy="186" r="40" fill="#e8f5e9" stroke="none" stroke-width="2"/>
<text x="220" y="200" font-size="34" fill="#2E7D32" font-weight="700" text-anchor="middle">≋</text>
<text x="220" y="262" font-size="19" fill="#2E7D32" font-weight="800" text-anchor="middle">Air or fan</text>
<text x="220" y="296" font-size="15" fill="#263238" font-weight="400" text-anchor="middle"><tspan x="220" dy="0">1–2 hours at room temperature,</tspan><tspan x="220" dy="20.25">after IPA (it dries fast)</tspan></text>
<rect x="420" y="120" width="360" height="240" rx="18" fill="#fff" stroke="#ffcc80" stroke-width="2" opacity="1" filter="url(#sh)"/>
<circle cx="600" cy="186" r="40" fill="#fff3e0" stroke="none" stroke-width="2"/>
<text x="600" y="200" font-size="34" fill="#E65100" font-weight="700" text-anchor="middle">♨</text>
<text x="600" y="262" font-size="19" fill="#E65100" font-weight="800" text-anchor="middle">Warm plate or oven</text>
<text x="600" y="296" font-size="15" fill="#263238" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">40–60 °C for 30–60 min.</tspan><tspan x="600" dy="20.25">Never above 70 °C.</tspan></text>
<rect x="800" y="120" width="360" height="240" rx="18" fill="#fff" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/>
<circle cx="980" cy="186" r="40" fill="#e3f2fd" stroke="none" stroke-width="2"/>
<text x="980" y="200" font-size="34" fill="#1565C0" font-weight="700" text-anchor="middle">⌕</text>
<text x="980" y="262" font-size="19" fill="#1565C0" font-weight="800" text-anchor="middle">Check under chips</text>
<text x="980" y="296" font-size="15" fill="#263238" font-weight="400" text-anchor="middle"><tspan x="980" dy="0">No liquid left under BGA</tspan><tspan x="980" dy="20.25">chips or connectors</tspan></text></svg>