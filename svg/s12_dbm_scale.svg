<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Reading signal strength in dBm</text>
<text x="40" y="84" font-size="17" fill="#55657a">Settings → About phone → Status → SIM status. The number is negative: closer to 0 is stronger.</text>
<text x="40" y="478" font-size="15" fill="#55657a">Values are a general guide for 4G. 2G and 5G use slightly different ranges.</text>
