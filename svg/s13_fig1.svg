<text x="1000" y="420" font-size="16" fill="#55657a" font-weight="700" text-anchor="middle">Days to weeks</text>
<rect x="40" y="490" width="1120" height="110" rx="12" fill="#ffebee" stroke="none" stroke-width="2" opacity="1"/><rect x="40" y="490" width="6" height="110" rx="3" fill="#C62828" stroke="none" stroke-width="2" opacity="1"/><circle cx="74" cy="545.0" r="15" fill="#C62828" stroke="none" stroke-width="2"/><text x="74" y="551.0" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">!</text><text x="102" y="528.2" font-size="16" fill="#263238" font-weight="400" text-anchor="start"><tspan x="102" dy="0">The battery keeps powering the board even when the phone looks off. Every minute it stays</tspan><tspan x="102" dy="22.4">connected, corrosion gets worse. That is why the first rule of liquid damage is:</tspan><tspan x="102" dy="22.4">disconnect the battery as soon as possible.</tspan></text></svg>