<text x="220" y="140" font-size="20" fill="#2E7D32" font-weight="800" text-anchor="middle">1. Dry</text>
<text x="220" y="176" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="220" dy="0">Dry board: no path</tspan><tspan x="220" dy="19.575000000000003">between the pads</tspan></text>
