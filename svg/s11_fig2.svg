<text x="636" y="490" font-size="15" fill="#263238" font-weight="400" text-anchor="start">Digital mic: VDD about 1.8 V while the mic is in use</text>
<text x="636" y="516" font-size="15" fill="#263238" font-weight="400" text-anchor="start">(make a voice recording or call). CLK only runs then.</text>
<text x="636" y="542" font-size="15" fill="#263238" font-weight="400" text-anchor="start">Analog mic: bias about 1.8–2.8 V on MIC+.</text>
<text x="636" y="568" font-size="15" fill="#263238" font-weight="400" text-anchor="start">No voltage? Follow the line back to the codec.</text></svg>