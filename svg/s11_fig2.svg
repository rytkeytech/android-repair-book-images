<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 11.2  Testing speakers and microphones with the multimeter</text>
<rect x="40" y="100" width="550" height="500" rx="18" fill="#fff" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="66" y="140" font-size="18" fill="#1565C0" font-weight="800" text-anchor="start">A.  Speaker or earpiece: resistance (Ω)</text>
<g transform="translate(70,170) rotate(0) scale(1.0)"><rect x="0" y="0" width="150" height="230" rx="22" fill="url(#yellow)" stroke="#c49000" stroke-width="2" opacity="1" filter="url(#sh)"/><rect x="16" y="16" width="118" height="62" rx="8" fill="#263238" stroke="#111" stroke-width="2" opacity="1"/><text x="75" y="58" font-size="26" fill="#76ff03" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono">7.8</text><text x="75" y="102" font-size="15" fill="#3e2723" font-weight="700" text-anchor="middle">Ω</text><circle cx="75" cy="150" r="34" fill="#37474f" stroke="#263238" stroke-width="3"/><rect x="71" y="120" width="8" height="26" rx="4" fill="#eceff1" stroke="none" stroke-width="2" opacity="1"/><circle cx="38" cy="205" r="10" fill="#212121" stroke="none" stroke-width="2"/><circle cx="75" cy="205" r="10" fill="#c62828" stroke="none" stroke-width="2"/><circle cx="112" cy="205" r="10" fill="#212121" stroke="none" stroke-width="2"/><text x="126" y="72" font-size="13" fill="#76ff03" font-weight="700" text-anchor="end">Ω</text></g>
<g transform="translate(330,260) rotate(0) scale(2.6)"><rect x="0" y="-14" width="22" height="28" rx="2" fill="#90a4ae" stroke="#546e7a" stroke-width="1.5" opacity="1"/><path d="M22 -14 L50 -36 L50 36 L22 14 Z" fill="#cfd8dc" stroke="#546e7a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/></g>
<rect x="355" y="300" width="16" height="26" rx="2" fill="#d4af37" stroke="none" stroke-width="2" opacity="1"/>
<rect x="395" y="300" width="16" height="26" rx="2" fill="#d4af37" stroke="none" stroke-width="2" opacity="1"/>
<path d="M108 375 C108 420 363 430 363 326" fill="none" stroke="#C62828" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<path d="M145 375 C145 440 403 450 403 326" fill="none" stroke="#1d1d1f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="66" y="490" font-size="15" fill="#263238" font-weight="400" text-anchor="start">Loudspeaker: about 6–8 Ω</text>
<text x="66" y="516" font-size="15" fill="#263238" font-weight="400" text-anchor="start">Earpiece: about 16–32 Ω</text>
<text x="66" y="542" font-size="15" fill="#263238" font-weight="400" text-anchor="start">OL = open coil (replace)  ·  0 Ω = shorted</text>
<text x="66" y="568" font-size="15" fill="#263238" font-weight="400" text-anchor="start">A faint click as you touch the probes is a good sign.</text>
<rect x="610" y="100" width="550" height="500" rx="18" fill="#fff" stroke="#a5d6a7" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="636" y="140" font-size="18" fill="#2E7D32" font-weight="800" text-anchor="start">B.  Microphone: power (V DC) while recording</text>
