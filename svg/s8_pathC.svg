<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Path C: stuck or boot loop. Is it software or storage?</text>
<text x="40" y="84" font-size="17" fill="#55657a">Connect the phone to a PC in boot or flash mode and see whether the tool detects it.</text>
<rect x="50" y="210" width="240" height="140" rx="16" fill="#fff" stroke="#cfd8dc" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="80" y="230" width="180" height="80" rx="6" fill="#263238" stroke="none" stroke-width="2" opacity="1"/>
<rect x="90" y="240" width="160" height="60" rx="3" fill="#4fc3f7" stroke="none" stroke-width="2" opacity="1"/>
<rect x="130" y="316" width="80" height="14" rx="3" fill="#90a4ae" stroke="none" stroke-width="2" opacity="1"/>
<text x="170" y="340" font-size="14" fill="#0D2847" font-weight="700" text-anchor="middle">PC in flash mode</text>
<path d="M292 260 C340 260 340 190 390 190" fill="none" stroke="#2E7D32" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#a2E7D32)"/>
<path d="M292 300 C340 300 340 380 390 380" fill="none" stroke="#C62828" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#aC62828)"/>
