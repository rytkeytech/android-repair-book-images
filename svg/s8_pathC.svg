<rect x="396" y="330" width="260" height="100" rx="12" fill="#C62828" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="526.0" y="374.87" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">Not detected</text><text x="526.0" y="398.62" font-size="16.5" fill="#ffffffcc" font-weight="400" text-anchor="middle">after checking the cable</text>
<line x1="660" y1="190" x2="700" y2="190" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" marker-end="url(#a2E7D32)"/>
<line x1="660" y1="380" x2="700" y2="380" stroke="#C62828" stroke-width="3" stroke-linecap="round" marker-end="url(#aC62828)"/>
<rect x="704" y="130" width="456" height="120" rx="14" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="2" opacity="1"/>
<text x="726" y="168" font-size="17" fill="#2E7D32" font-weight="700" text-anchor="start">Flash the correct firmware.</text>
<text x="726" y="196" font-size="16" fill="#263238" font-weight="400" text-anchor="start">Boots? It was software. Fixed.</text>
<text x="726" y="222" font-size="16" fill="#263238" font-weight="400" text-anchor="start">Still fails? Suspect storage.</text>
<rect x="704" y="320" width="456" height="120" rx="14" fill="#ffebee" stroke="#ef9a9a" stroke-width="2" opacity="1"/>
<text x="726" y="358" font-size="17" fill="#C62828" font-weight="700" text-anchor="start">Hardware path:</text>
<text x="726" y="386" font-size="16" fill="#263238" font-weight="400" text-anchor="start">check USB data lines, crystal,</text>
<text x="726" y="412" font-size="16" fill="#263238" font-weight="400" text-anchor="start">CPU and storage rails, then storage.</text>
<rect x="50" y="470" width="1110" height="56" rx="12" fill="#fff3e0" stroke="none" stroke-width="2" opacity="1"/><rect x="50" y="470" width="6" height="56" rx="3" fill="#E65100" stroke="none" stroke-width="2" opacity="1"/><circle cx="84" cy="498.0" r="15" fill="#E65100" stroke="none" stroke-width="2"/><text x="84" y="504.0" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">!</text><text x="112" y="503.6" font-size="16" fill="#263238" font-weight="400" text-anchor="start">Flashing can erase user data. Ask the customer and back up anything you can first.</text></svg>