<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Multimeter quick guide</text>
<text x="64" y="132" font-size="16" fill="#0D2847" font-weight="800" text-anchor="start">Question</text>
<text x="380" y="132" font-size="16" fill="#0D2847" font-weight="800" text-anchor="start">Mode</text>
<text x="590" y="132" font-size="16" fill="#0D2847" font-weight="800" text-anchor="start">Setup</text>
<text x="900" y="132" font-size="16" fill="#0D2847" font-weight="800" text-anchor="start">Good / bad</text>
<rect x="40" y="150" width="1120" height="64" rx="14" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="40" y="150" width="8" height="64" rx="4" fill="#E65100" stroke="none" stroke-width="2" opacity="1"/>
<text x="64" y="189" font-size="17" fill="#0D2847" font-weight="800" text-anchor="start">Is the line shorted?</text>
<rect x="370" y="164" width="180" height="36" rx="18" fill="#fff3e0" stroke="none" stroke-width="2" opacity="1"/>
<text x="460" y="188" font-size="15.5" fill="#E65100" font-weight="800" text-anchor="middle">Diode mode</text>
<text x="590" y="189" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">battery OFF, red probe on GND</text>
<text x="900" y="189" font-size="15.5" fill="#263238" font-weight="700" text-anchor="start">near 0 = short</text>
<rect x="40" y="226" width="1120" height="64" rx="14" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="40" y="226" width="8" height="64" rx="4" fill="#1565C0" stroke="none" stroke-width="2" opacity="1"/>
<text x="64" y="265" font-size="17" fill="#0D2847" font-weight="800" text-anchor="start">Is a voltage present?</text>
<rect x="370" y="240" width="180" height="36" rx="18" fill="#e3f2fd" stroke="none" stroke-width="2" opacity="1"/>
<text x="460" y="264" font-size="15.5" fill="#1565C0" font-weight="800" text-anchor="middle">DC volts</text>
<text x="590" y="265" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">phone ON, black probe on GND</text>
<text x="900" y="265" font-size="15.5" fill="#263238" font-weight="700" text-anchor="start">compare with schematic</text>
<rect x="40" y="302" width="1120" height="64" rx="14" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="40" y="302" width="8" height="64" rx="4" fill="#6A1B9A" stroke="none" stroke-width="2" opacity="1"/>
<text x="64" y="341" font-size="17" fill="#0D2847" font-weight="800" text-anchor="start">Is the fuse or coil OK?</text>
<rect x="370" y="316" width="180" height="36" rx="18" fill="#f3e5f5" stroke="none" stroke-width="2" opacity="1"/>
<text x="460" y="340" font-size="15.5" fill="#6A1B9A" font-weight="800" text-anchor="middle">Continuity / Ω</text>
<text x="590" y="341" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">battery OFF</text>
<text x="900" y="341" font-size="15.5" fill="#263238" font-weight="700" text-anchor="start">beep, near 0 Ω = OK</text>
<rect x="40" y="378" width="1120" height="64" rx="14" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="40" y="378" width="8" height="64" rx="4" fill="#2E7D32" stroke="none" stroke-width="2" opacity="1"/>
<text x="64" y="417" font-size="17" fill="#0D2847" font-weight="800" text-anchor="start">Is the speaker OK?</text>
<rect x="370" y="392" width="180" height="36" rx="18" fill="#e8f5e9" stroke="none" stroke-width="2" opacity="1"/>
<text x="460" y="416" font-size="15.5" fill="#2E7D32" font-weight="800" text-anchor="middle">Resistance Ω</text>
<text x="590" y="417" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">speaker out of circuit</text>
<text x="900" y="417" font-size="15.5" fill="#263238" font-weight="700" text-anchor="start">about 8 Ω</text>
<rect x="40" y="454" width="1120" height="64" rx="14" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="40" y="454" width="8" height="64" rx="4" fill="#00796B" stroke="none" stroke-width="2" opacity="1"/>
<text x="64" y="493" font-size="17" fill="#0D2847" font-weight="800" text-anchor="start">Is the battery OK?</text>
<rect x="370" y="468" width="180" height="36" rx="18" fill="#e0f2f1" stroke="none" stroke-width="2" opacity="1"/>
<text x="460" y="492" font-size="15.5" fill="#00796B" font-weight="800" text-anchor="middle">DC volts</text>
<text x="590" y="493" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">on the battery pins</text>
<text x="900" y="493" font-size="15.5" fill="#263238" font-weight="700" text-anchor="start">3.7 – 4.4 V</text></svg>