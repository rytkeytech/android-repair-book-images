<marker id="a0D2847" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0D2847"/></marker><marker id="aE65100" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E65100"/></marker><marker id="a1565C0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1565C0"/></marker><marker id="a2E7D32" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aC62828" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C62828"/></marker><marker id="a6A1B9A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6A1B9A"/></marker><marker id="a00796B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00796B"/></marker><marker id="a546E7A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#546E7A"/></marker><marker id="a1d1d1f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f"/></marker><marker id="aff5722" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5722"/></marker><marker id="affffff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="640" fill="#fff"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 12.2  SIM card contacts and what to measure</text>
<text x="40" y="84" font-size="17" fill="#55657a">Contact side of the SIM (cut corner at top left).</text>
<path d="M90 160 L150 110 H400 Q414 110 414 124 V520 Q414 534 400 534 H104 Q90 534 90 520 Z" fill="#ffe082" stroke="#c49000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="120" y="160" width="110" height="90" rx="14" fill="url(#copper)" stroke="#8d6e1a" stroke-width="2" opacity="1"/>
<text x="175" y="200" font-size="16" fill="#3e2723" font-weight="800" text-anchor="middle">C1</text>
<text x="175" y="224" font-size="15" fill="#3e2723" font-weight="700" text-anchor="middle">VCC</text>
<rect x="120" y="270" width="110" height="90" rx="14" fill="url(#copper)" stroke="#8d6e1a" stroke-width="2" opacity="1"/>
<text x="175" y="310" font-size="16" fill="#3e2723" font-weight="800" text-anchor="middle">C2</text>
<text x="175" y="334" font-size="15" fill="#3e2723" font-weight="700" text-anchor="middle">RST</text>
<rect x="120" y="380" width="110" height="90" rx="14" fill="url(#copper)" stroke="#8d6e1a" stroke-width="2" opacity="1"/>
<text x="175" y="420" font-size="16" fill="#3e2723" font-weight="800" text-anchor="middle">C3</text>
<text x="175" y="444" font-size="15" fill="#3e2723" font-weight="700" text-anchor="middle">CLK</text>
<rect x="270" y="160" width="110" height="90" rx="14" fill="url(#copper)" stroke="#8d6e1a" stroke-width="2" opacity="1"/>
<text x="325" y="200" font-size="16" fill="#3e2723" font-weight="800" text-anchor="middle">C5</text>
<text x="325" y="224" font-size="15" fill="#3e2723" font-weight="700" text-anchor="middle">GND</text>
<rect x="270" y="270" width="110" height="90" rx="14" fill="url(#copper)" stroke="#8d6e1a" stroke-width="2" opacity="1"/>
<text x="325" y="310" font-size="16" fill="#3e2723" font-weight="800" text-anchor="middle">C6</text>
<text x="325" y="334" font-size="15" fill="#3e2723" font-weight="700" text-anchor="middle">VPP</text>
<rect x="270" y="380" width="110" height="90" rx="14" fill="url(#copper)" stroke="#8d6e1a" stroke-width="2" opacity="1"/>
<text x="325" y="420" font-size="16" fill="#3e2723" font-weight="800" text-anchor="middle">C7</text>
<text x="325" y="444" font-size="15" fill="#3e2723" font-weight="700" text-anchor="middle">I/O</text>
<rect x="470" y="130" width="690" height="46" rx="10" fill="#ffebee" stroke="none" stroke-width="2" opacity="1"/>
<text x="490" y="159" font-size="16" fill="#C62828" font-weight="800" text-anchor="start">C1  VCC</text>
<text x="600" y="159" font-size="14.5" fill="#263238" font-weight="400" text-anchor="start">SIM power: 1.8 V or 3 V, briefly at start-up or SIM read</text>
<rect x="470" y="186" width="690" height="46" rx="10" fill="#e3f2fd" stroke="none" stroke-width="2" opacity="1"/>
<text x="490" y="215" font-size="16" fill="#1565C0" font-weight="800" text-anchor="start">C2  RST</text>
<text x="600" y="215" font-size="14.5" fill="#263238" font-weight="400" text-anchor="start">Reset signal from the modem</text>
<rect x="470" y="242" width="690" height="46" rx="10" fill="#e3f2fd" stroke="none" stroke-width="2" opacity="1"/>
<text x="490" y="271" font-size="16" fill="#1565C0" font-weight="800" text-anchor="start">C3  CLK</text>
<text x="600" y="271" font-size="14.5" fill="#263238" font-weight="400" text-anchor="start">Clock signal from the modem</text>
<rect x="470" y="298" width="690" height="46" rx="10" fill="#eceff1" stroke="none" stroke-width="2" opacity="1"/>
<text x="490" y="327" font-size="16" fill="#1d1d1f" font-weight="800" text-anchor="start">C5  GND</text>
<text x="600" y="327" font-size="14.5" fill="#263238" font-weight="400" text-anchor="start">Ground</text>
<rect x="470" y="354" width="690" height="46" rx="10" fill="#eceff1" stroke="none" stroke-width="2" opacity="1"/>
<text x="490" y="383" font-size="16" fill="#546E7A" font-weight="800" text-anchor="start">C6  VPP</text>
<text x="600" y="383" font-size="14.5" fill="#263238" font-weight="400" text-anchor="start">Not used on most phones (some NFC SIMs use it)</text>
<rect x="470" y="410" width="690" height="46" rx="10" fill="#e3f2fd" stroke="none" stroke-width="2" opacity="1"/>
<text x="490" y="439" font-size="16" fill="#1565C0" font-weight="800" text-anchor="start">C7  I/O</text>
<text x="600" y="439" font-size="14.5" fill="#263238" font-weight="400" text-anchor="start">Data line between the SIM and the phone</text>
<rect x="470" y="480" width="690" height="120" rx="12" fill="#fff3e0" stroke="none" stroke-width="2" opacity="1"/><rect x="470" y="480" width="6" height="120" rx="3" fill="#E65100" stroke="none" stroke-width="2" opacity="1"/><circle cx="504" cy="540.0" r="15" fill="#E65100" stroke="none" stroke-width="2"/><text x="504" y="546.0" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">!</text><text x="532" y="513.75" font-size="15" fill="#263238" font-weight="400" text-anchor="start"><tspan x="532" dy="0">On the board: check each reader pin in diode mode against a good board.</tspan><tspan x="532" dy="21.0">A short on VCC, CLK, RST or I/O, or a corroded pin, gives 'No SIM'.</tspan><tspan x="532" dy="21.0">Many readers also have a SIM-detect switch: if it is bent, the phone</tspan><tspan x="532" dy="21.0">never looks for the SIM.</tspan></text></svg>