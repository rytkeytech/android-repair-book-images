<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Typical sections of a phone motherboard</text>
<text x="40" y="84" font-size="17" fill="#55657a">Every brand places them differently, but every phone has all of them.</text>
<rect x="60" y="110" width="520" height="580" rx="26" fill="url(#pcb)" stroke="#123d22" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="80" y="130" width="230" height="165" rx="14" fill="#6A1B9A" stroke="#ffffff55" stroke-width="2" opacity="0.92"/>
<text x="195.0" y="190" font-size="16" fill="#fff" font-weight="800" text-anchor="middle">RF / NETWORK</text>
<text x="195.0" y="222" font-size="14.5" fill="#ffffffdd" font-weight="400" text-anchor="middle"><tspan x="195.0" dy="0">transceiver, PAs,</tspan><tspan x="195.0" dy="19.575000000000003">antenna switch</tspan></text>
<rect x="258" y="255" width="34" height="22" rx="3" fill="url(#shield)" stroke="none" stroke-width="0" opacity="0.85"/>
<rect x="96" y="261" width="16" height="10" rx="1" fill="#cfd8dc" stroke="none" stroke-width="0" opacity="0.9"/>
<rect x="118" y="261" width="16" height="10" rx="1" fill="#cfd8dc" stroke="none" stroke-width="0" opacity="0.9"/>
<rect x="330" y="130" width="230" height="165" rx="14" fill="#00796B" stroke="#ffffff55" stroke-width="2" opacity="0.92"/>
<text x="445.0" y="190" font-size="16" fill="#fff" font-weight="800" text-anchor="middle">CAMERAS + SENSORS</text>
<text x="445.0" y="222" font-size="14.5" fill="#ffffffdd" font-weight="400" text-anchor="middle"><tspan x="445.0" dy="0">camera and</tspan><tspan x="445.0" dy="19.575000000000003">sensor connectors</tspan></text>
<rect x="508" y="255" width="34" height="22" rx="3" fill="url(#shield)" stroke="none" stroke-width="0" opacity="0.85"/>
<rect x="346" y="261" width="16" height="10" rx="1" fill="#cfd8dc" stroke="none" stroke-width="0" opacity="0.9"/>
<rect x="368" y="261" width="16" height="10" rx="1" fill="#cfd8dc" stroke="none" stroke-width="0" opacity="0.9"/>
<rect x="80" y="315" width="230" height="165" rx="14" fill="#0D2847" stroke="#ffffff55" stroke-width="2" opacity="0.92"/>
<text x="195.0" y="375" font-size="16" fill="#fff" font-weight="800" text-anchor="middle">CPU + RAM + STORAGE</text>
<text x="195.0" y="407" font-size="14.5" fill="#ffffffdd" font-weight="400" text-anchor="middle"><tspan x="195.0" dy="0">the brain and</tspan><tspan x="195.0" dy="19.575000000000003">its memory</tspan></text>
<rect x="258" y="440" width="34" height="22" rx="3" fill="url(#shield)" stroke="none" stroke-width="0" opacity="0.85"/>
<rect x="96" y="446" width="16" height="10" rx="1" fill="#cfd8dc" stroke="none" stroke-width="0" opacity="0.9"/>
<rect x="118" y="446" width="16" height="10" rx="1" fill="#cfd8dc" stroke="none" stroke-width="0" opacity="0.9"/>
<rect x="330" y="315" width="230" height="165" rx="14" fill="#E65100" stroke="#ffffff55" stroke-width="2" opacity="0.92"/>
<text x="445.0" y="375" font-size="16" fill="#fff" font-weight="800" text-anchor="middle">POWER</text>
<text x="445.0" y="407" font-size="14.5" fill="#ffffffdd" font-weight="400" text-anchor="middle"><tspan x="445.0" dy="0">PMIC, coils,</tspan><tspan x="445.0" dy="19.575000000000003">capacitors</tspan></text>
