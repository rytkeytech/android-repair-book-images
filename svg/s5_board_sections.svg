<rect x="630" y="508" width="8" height="64" rx="4" fill="#C62828" stroke="none" stroke-width="2" opacity="1"/>
<text x="660" y="547" font-size="17" fill="#263238" font-weight="600" text-anchor="start">Not charging, slow charging</text>
