<rect x="630" y="590" width="8" height="64" rx="4" fill="#1565C0" stroke="none" stroke-width="2" opacity="1"/>
<text x="660" y="629" font-size="17" fill="#263238" font-weight="600" text-anchor="start">No sound, no display</text></svg>