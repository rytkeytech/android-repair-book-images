<text x="195.0" y="592" font-size="14.5" fill="#ffffffdd" font-weight="400" text-anchor="middle"><tspan x="195.0" dy="0">OVP, charging IC,</tspan><tspan x="195.0" dy="19.575000000000003">battery connector</tspan></text>
