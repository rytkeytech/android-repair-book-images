<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">How to test components (2 of 3): switching and signal parts</text>
<text x="40" y="84" font-size="17" fill="#55657a">Battery removed. Remove the part from the board if the readings look strange.</text>
<rect x="40" y="110" width="360" height="316" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/><rect x="40" y="110" width="360" height="112" rx="18" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><rect x="40" y="204" width="360" height="18" rx="0" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><g transform="translate(220,168) rotate(0) scale(1)"><rect x="-26" y="-22" width="52" height="36" rx="3" fill="#212121" stroke="none" stroke-width="2" opacity="1"/><rect x="-20" y="14" width="10" height="12" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="10" y="14" width="10" height="12" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="-5" y="-34" width="10" height="12" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><text x="-15" y="40" font-size="11" fill="#1a237e" font-weight="800" text-anchor="middle">B</text><text x="15" y="40" font-size="11" fill="#1a237e" font-weight="800" text-anchor="middle">E</text><text x="0" y="-38" font-size="11" fill="#1a237e" font-weight="800" text-anchor="middle">C</text></g><text x="60" y="252" font-size="19" fill="#0D2847" font-weight="800" text-anchor="start">Transistor (NPN)</text><rect x="276" y="232" width="108" height="28" rx="14" fill="#fff3e0" stroke="none" stroke-width="2" opacity="1"/><text x="330" y="251" font-size="13.5" fill="#E65100" font-weight="800" text-anchor="middle">Diode mode</text><text x="60" y="284" font-size="14" fill="#37474f" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Red on B, black on E,</tspan><tspan x="60" dy="18.2">then black on C.</tspan></text><circle cx="70" cy="337" r="11" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M65.05 337 L68.9 341.18 L75.5 333.15" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="90" y="342" font-size="14.5" fill="#2E7D32" font-weight="700" text-anchor="start">About 0.6 both, OL reversed</text><circle cx="70" cy="376" r="11" fill="#C62828" stroke="none" stroke-width="2"/><path d="M65.82 371.82 L74.18 380.18 M74.18 371.82 L65.82 380.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="90" y="381" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start"><tspan x="90" dy="0">0 on any pair = shorted</tspan><tspan x="90" dy="18.85">(PNP: swap the probes)</tspan></text>
<rect x="420" y="110" width="360" height="316" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/><rect x="420" y="110" width="360" height="112" rx="18" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><rect x="420" y="204" width="360" height="18" rx="0" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><g transform="translate(600,168) rotate(0) scale(1)"><rect x="-30" y="-24" width="60" height="40" rx="3" fill="#212121" stroke="none" stroke-width="2" opacity="1"/><rect x="-24" y="16" width="10" height="12" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="14" y="16" width="10" height="12" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="-5" y="-36" width="10" height="12" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><text x="-19" y="42" font-size="11" fill="#1a237e" font-weight="800" text-anchor="middle">G</text><text x="19" y="42" font-size="11" fill="#1a237e" font-weight="800" text-anchor="middle">S</text><text x="0" y="-40" font-size="11" fill="#1a237e" font-weight="800" text-anchor="middle">D</text></g><text x="440" y="252" font-size="19" fill="#0D2847" font-weight="800" text-anchor="start">MOSFET</text><rect x="656" y="232" width="108" height="28" rx="14" fill="#fff3e0" stroke="none" stroke-width="2" opacity="1"/><text x="710" y="251" font-size="13.5" fill="#E65100" font-weight="800" text-anchor="middle">Diode mode</text><text x="440" y="284" font-size="14" fill="#37474f" font-weight="400" text-anchor="start"><tspan x="440" dy="0">Red on S, black on D.</tspan><tspan x="440" dy="18.2">Then gate to each pin.</tspan></text><circle cx="450" cy="337" r="11" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M445.05 337 L448.9 341.18 L455.5 333.15" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="470" y="342" font-size="14.5" fill="#2E7D32" font-weight="700" text-anchor="start">0.4–0.7 S→D, gate OL</text><circle cx="450" cy="376" r="11" fill="#C62828" stroke="none" stroke-width="2"/><path d="M445.82 371.82 L454.18 380.18 M454.18 371.82 L445.82 380.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="470" y="381" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start">0 between D and S = shorted</text>
<rect x="800" y="110" width="360" height="316" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/><rect x="800" y="110" width="360" height="112" rx="18" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><rect x="800" y="204" width="360" height="18" rx="0" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><g transform="translate(980,168) rotate(0) scale(1)"><rect x="-42" y="-18" width="84" height="36" rx="6" fill="url(#metal)" stroke="#78909c" stroke-width="2" opacity="1"/><text x="0" y="5" font-size="11" fill="#37474f" font-weight="700" text-anchor="middle">32.768K</text></g><text x="820" y="252" font-size="19" fill="#0D2847" font-weight="800" text-anchor="start">Crystal</text><rect x="1036" y="232" width="108" height="28" rx="14" fill="#e3f2fd" stroke="none" stroke-width="2" opacity="1"/><text x="1090" y="251" font-size="13.5" fill="#1565C0" font-weight="800" text-anchor="middle">Ω mode + eyes</text><text x="820" y="284" font-size="14" fill="#37474f" font-weight="400" text-anchor="start"><tspan x="820" dy="0">Across both pins.</tspan><tspan x="820" dy="18.2">Look for cracks or rust.</tspan></text><circle cx="830" cy="337" r="11" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M825.05 337 L828.9 341.18 L835.5 333.15" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="850" y="342" font-size="14.5" fill="#2E7D32" font-weight="700" text-anchor="start">OL (no connection)</text><circle cx="830" cy="376" r="11" fill="#C62828" stroke="none" stroke-width="2"/><path d="M825.82 371.82 L834.18 380.18 M834.18 371.82 L825.82 380.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="850" y="381" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start"><tspan x="850" dy="0">0 Ω = shorted. Best test:</tspan><tspan x="850" dy="18.85">fit a good crystal</tspan></text>
<rect x="40" y="446" width="360" height="316" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/><rect x="40" y="446" width="360" height="112" rx="18" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><rect x="40" y="540" width="360" height="18" rx="0" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><g transform="translate(220,504) rotate(0) scale(1)"><rect x="-24" y="-16" width="48" height="32" rx="4" fill="#fffde7" stroke="#f9a825" stroke-width="2" opacity="1"/><circle cx="0" cy="0" r="9" fill="#fff59d" stroke="none" stroke-width="2"/><line x1="18" y1="-22" x2="30" y2="-34" stroke="#E65100" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aE65100)"/><line x1="26" y1="-14" x2="38" y2="-26" stroke="#E65100" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aE65100)"/></g><text x="60" y="588" font-size="19" fill="#0D2847" font-weight="800" text-anchor="start">LED</text><rect x="276" y="568" width="108" height="28" rx="14" fill="#fff3e0" stroke="none" stroke-width="2" opacity="1"/><text x="330" y="587" font-size="13.5" fill="#E65100" font-weight="800" text-anchor="middle">Diode mode</text><text x="60" y="620" font-size="14" fill="#37474f" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Red on anode,</tspan><tspan x="60" dy="18.2">black on cathode.</tspan></text><circle cx="70" cy="673" r="11" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M65.05 673 L68.9 677.18 L75.5 669.15" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="90" y="678" font-size="14.5" fill="#2E7D32" font-weight="700" text-anchor="start">Glows faintly one way</text><circle cx="70" cy="712" r="11" fill="#C62828" stroke="none" stroke-width="2"/><path d="M65.82 707.82 L74.18 716.18 M74.18 707.82 L65.82 716.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="90" y="717" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start"><tspan x="90" dy="0">Dark both ways = open</tspan><tspan x="90" dy="18.85">(white LEDs may read OL)</tspan></text>
<rect x="420" y="446" width="360" height="316" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/><rect x="420" y="446" width="360" height="112" rx="18" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><rect x="420" y="540" width="360" height="18" rx="0" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><g transform="translate(600,504) rotate(0) scale(1)"><rect x="-56" y="-26" width="112" height="52" rx="12" fill="#37474f" stroke="#263238" stroke-width="2" opacity="1"/><rect x="-46" y="-18" width="92" height="36" rx="8" fill="#90a4ae" stroke="none" stroke-width="2" opacity="1"/><rect x="-10" y="26" width="8" height="10" rx="1" fill="#d4af37" stroke="none" stroke-width="2" opacity="1"/><rect x="6" y="26" width="8" height="10" rx="1" fill="#d4af37" stroke="none" stroke-width="2" opacity="1"/></g><text x="440" y="588" font-size="19" fill="#0D2847" font-weight="800" text-anchor="start">Speaker / earpiece</text><rect x="656" y="568" width="108" height="28" rx="14" fill="#e8f5e9" stroke="none" stroke-width="2" opacity="1"/><text x="710" y="587" font-size="13.5" fill="#2E7D32" font-weight="800" text-anchor="middle">Ω mode</text><text x="440" y="620" font-size="14" fill="#37474f" font-weight="400" text-anchor="start">Probes on the two pads.</text><circle cx="450" cy="659" r="11" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M445.05 659 L448.9 663.18 L455.5 655.15" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="470" y="664" font-size="14.5" fill="#2E7D32" font-weight="700" text-anchor="start">Speaker 6–8 Ω, ear 16–32 Ω</text><circle cx="450" cy="698" r="11" fill="#C62828" stroke="none" stroke-width="2"/><path d="M445.82 693.82 L454.18 702.18 M454.18 693.82 L445.82 702.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="470" y="703" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start">OL = open coil · 0 = shorted</text>
<rect x="800" y="446" width="360" height="316" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/><rect x="800" y="446" width="360" height="112" rx="18" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><rect x="800" y="540" width="360" height="18" rx="0" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><g transform="translate(980,504) rotate(0) scale(1)"><rect x="-26" y="-22" width="52" height="44" rx="6" fill="#b0bec5" stroke="#546e7a" stroke-width="2" opacity="1"/><circle cx="0" cy="0" r="9" fill="#263238" stroke="none" stroke-width="2"/></g><text x="820" y="588" font-size="19" fill="#0D2847" font-weight="800" text-anchor="start">Microphone</text><rect x="1036" y="568" width="108" height="28" rx="14" fill="#e3f2fd" stroke="none" stroke-width="2" opacity="1"/><text x="1090" y="587" font-size="13.5" fill="#1565C0" font-weight="800" text-anchor="middle">DC volts</text><text x="820" y="620" font-size="14" fill="#37474f" font-weight="400" text-anchor="start"><tspan x="820" dy="0">Phone on, recording.</tspan><tspan x="820" dy="18.2">Black on GND, red on VDD.</tspan></text><circle cx="830" cy="673" r="11" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M825.05 673 L828.9 677.18 L835.5 669.15" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="850" y="678" font-size="14.5" fill="#2E7D32" font-weight="700" text-anchor="start">About 1.8–2.2 V</text><circle cx="830" cy="712" r="11" fill="#C62828" stroke="none" stroke-width="2"/><path d="M825.82 707.82 L834.18 716.18 M834.18 707.82 L825.82 716.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="850" y="717" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start"><tspan x="850" dy="0">0 V = no power to the mic</tspan><tspan x="850" dy="18.85">Power OK, no sound = bad mic</tspan></text></svg>