<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 15.1  A BGA chip: why the joints are hidden (cross-section)</text>
<text x="40" y="84" font-size="17" fill="#55657a">You cannot see or touch these joints. Drops, heat and corrosion are the main causes of BGA joint failure.</text>
