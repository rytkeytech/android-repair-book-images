<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Cleaning a liquid-damaged board</text>
<rect x="40" y="120" width="192" height="100" rx="12" fill="#00796B" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="136.0" y="165.41" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="136.0" dy="0">Remove</tspan><tspan x="136.0" dy="21.25">shields</tspan></text><circle cx="58" cy="122" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="58" y="126.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="136.0" y="246" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="136.0" dy="0">corrosion hides</tspan><tspan x="136.0" dy="19.575000000000003">under them</tspan></text><line x1="237" y1="170.0" x2="257" y2="170.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="262" y="120" width="192" height="100" rx="12" fill="#00796B" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="358.0" y="175.95" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">IPA 99 %</text><circle cx="280" cy="122" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="280" y="126.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="358.0" y="246" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="358.0" dy="0">never tap water or</tspan><tspan x="358.0" dy="19.575000000000003">low-grade alcohol</tspan></text><line x1="459" y1="170.0" x2="479" y2="170.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="484" y="120" width="192" height="100" rx="12" fill="#00796B" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="580.0" y="175.95" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">Soft brush</text><circle cx="502" cy="122" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="502" y="126.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="580.0" y="246" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="580.0" dy="0">work gently under</tspan><tspan x="580.0" dy="19.575000000000003">chips and connectors</tspan></text><line x1="681" y1="170.0" x2="701" y2="170.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="706" y="120" width="192" height="100" rx="12" fill="#00796B" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="802.0" y="165.41" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="802.0" dy="0">Ultrasonic</tspan><tspan x="802.0" dy="21.25">bath</tspan></text><circle cx="724" cy="122" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="724" y="126.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="802.0" y="246" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="802.0" dy="0">3–5 min in IPA or</tspan><tspan x="802.0" dy="19.575000000000003">board cleaner</tspan></text><line x1="903" y1="170.0" x2="923" y2="170.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="928" y="120" width="192" height="100" rx="12" fill="#00796B" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="1024.0" y="165.41" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="1024.0" dy="0">Rinse +</tspan><tspan x="1024.0" dy="21.25">inspect</tspan></text><circle cx="946" cy="122" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="946" y="126.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="1024.0" y="246" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="1024.0" dy="0">fresh IPA, then a</tspan><tspan x="1024.0" dy="19.575000000000003">microscope check</tspan></text>
<rect x="40" y="340" width="1120" height="90" rx="12" fill="#ffebee" stroke="none" stroke-width="2" opacity="1"/><rect x="40" y="340" width="6" height="90" rx="3" fill="#C62828" stroke="none" stroke-width="2" opacity="1"/><circle cx="74" cy="385.0" r="15" fill="#C62828" stroke="none" stroke-width="2"/><text x="74" y="391.0" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">!</text><text x="102" y="379.40000000000003" font-size="16" fill="#263238" font-weight="400" text-anchor="start"><tspan x="102" dy="0">Never put the battery, screen, speaker, mic or cameras in the ultrasonic bath.</tspan><tspan x="102" dy="22.4">They can be damaged, or their membranes torn.</tspan></text></svg>