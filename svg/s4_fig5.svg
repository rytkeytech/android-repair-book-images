<rect x="40" y="460" width="1120" height="150" rx="12" fill="#e3f2fd" stroke="none" stroke-width="2" opacity="1"/><rect x="40" y="460" width="6" height="150" rx="3" fill="#1565C0" stroke="none" stroke-width="2" opacity="1"/><circle cx="74" cy="535.0" r="15" fill="#1565C0" stroke="none" stroke-width="2"/><text x="74" y="541.0" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">i</text><text x="102" y="518.2" font-size="16" fill="#263238" font-weight="400" text-anchor="start"><tspan x="102" dy="0">How it works: pressing the button on J5 connects the PWR line to ground. The PMIC sees</tspan><tspan x="102" dy="22.4">KPD_PWR_N go low (_N means active-low) and starts the phone. If the phone will not</tspan><tspan x="102" dy="22.4">power on, measure this net before replacing the PMIC.</tspan></text></svg>