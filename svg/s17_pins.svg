<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Battery connector and charging port pins (common layout)</text>
<text x="40" y="84" font-size="17" fill="#55657a">Pin order changes between models. Check the schematic before you measure.</text>
