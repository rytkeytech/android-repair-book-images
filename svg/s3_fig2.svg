<text x="650" y="480" font-size="20" fill="#0D2847" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono">1/R total = 1/R1 + 1/R2 + ...</text>
<text x="650" y="520" font-size="17" fill="#C62828" font-weight="700" text-anchor="start">C3 shorted: the WHOLE VBAT line</text>
<text x="650" y="545" font-size="17" fill="#C62828" font-weight="700" text-anchor="start">reads 0.000 at every capacitor.</text></svg>