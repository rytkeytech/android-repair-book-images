<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 3.2  Series and parallel circuits on a phone board</text>
<rect x="40" y="100" width="540" height="500" rx="18" fill="#fff" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="620" y="100" width="540" height="500" rx="18" fill="#fff" stroke="#a5d6a7" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="70" y="145" font-size="21" fill="#1565C0" font-weight="700" text-anchor="start">SERIES: one path, same current</text>
<text x="70" y="250" font-size="16" fill="#C62828" font-weight="700" text-anchor="start">VBUS</text>
<path d="M125 245 L165 245" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="165" y="236" width="70" height="18" rx="2" fill="#fff" stroke="#1d1d1f" stroke-width="2" opacity="1"/><text x="200.0" y="229" font-size="14" fill="#1d1d1f" font-weight="600" text-anchor="middle">F (fuse)</text>
<path d="M235 245 L275 245" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<path d="M275 245 a9 9 0 0 1 18 0 a9 9 0 0 1 18 0 a9 9 0 0 1 18 0 a9 9 0 0 1 18 0" fill="none" stroke="#1d1d1f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="311" y="229" font-size="14" fill="#1d1d1f" font-weight="600" text-anchor="middle">L (coil)</text>
<path d="M347 245 L390 245" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="390" y="215" width="150" height="60" rx="12" fill="#0D2847" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="465.0" y="250.25" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">Charging IC</text>
<line x1="130" y1="300" x2="470" y2="300" stroke="#1565C0" stroke-width="3" stroke-linecap="round" marker-end="url(#a1565C0)"/>
<text x="300" y="325" font-size="14" fill="#1565C0" font-weight="600" text-anchor="middle">current flows through each part in turn</text>
<text x="70" y="395" font-size="20" fill="#0D2847" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono">R total = R1 + R2 + R3</text>
<rect x="70" y="430" width="480" height="120" rx="12" fill="#ffebee" stroke="none" stroke-width="2" opacity="1"/><rect x="70" y="430" width="6" height="120" rx="3" fill="#C62828" stroke="none" stroke-width="2" opacity="1"/><circle cx="104" cy="490.0" r="15" fill="#C62828" stroke="none" stroke-width="2"/><text x="104" y="496.0" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">!</text><text x="132" y="473.20000000000005" font-size="16" fill="#263238" font-weight="400" text-anchor="start"><tspan x="132" dy="0">If the fuse or coil OPENS,</tspan><tspan x="132" dy="22.4">nothing after it gets power:</tspan><tspan x="132" dy="22.4">the phone will not charge.</tspan></text>
<text x="650" y="145" font-size="21" fill="#2E7D32" font-weight="700" text-anchor="start">PARALLEL: many paths, same voltage</text>
