<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b1a2b" flood-opacity=".14"/></filter>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa4ad"/><stop offset=".5" stop-color="#eef1f3"/><stop offset="1" stop-color="#8a949d"/></linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Six safety rules at the repair bench</text>
  <text x="40" y="84" font-size="17" fill="#55657a">Safety is part of the job, not an extra. Learn these before you open your first phone.</text>

  <!-- card template: 360x290 -->
  <!-- 1 Battery -->
  <g transform="translate(40,115)">
    <rect width="360" height="300" rx="20" fill="#fff" stroke="#ffcdd2" stroke-width="2" filter="url(#sh)"/>
    <rect width="360" height="150" rx="20" fill="#ffebee"/><rect y="130" width="360" height="20" fill="#ffebee"/>
    <!-- battery icon with unplugged connector -->
    <g transform="translate(70,30)">
      <rect x="0" y="20" width="150" height="80" rx="10" fill="#37474f"/><rect x="150" y="45" width="10" height="30" rx="3" fill="#37474f"/>
      <rect x="10" y="30" width="60" height="60" rx="5" fill="#c62828"/><rect x="74" y="30" width="30" height="60" rx="5" fill="#ef5350" opacity=".5"/>
      <path d="M160 60 C180 60 185 30 205 30" stroke="#455a64" stroke-width="5" fill="none"/>
      <rect x="203" y="20" width="18" height="22" rx="3" fill="#d4af37" stroke="#8d6e1a"/>
      <path d="M180 82 l24 -24 M204 82 l-24 -24" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle cx="36" cy="186" r="18" fill="#c62828"/><text x="36" y="192" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">1</text>
    <text x="64" y="193" font-size="21" font-weight="700" fill="#c62828">Battery first</text>
    <text x="24" y="232" font-size="15.5" fill="#263238">Unplug the battery before any other</text>
    <text x="24" y="254" font-size="15.5" fill="#263238">connector and before soldering.</text>
    <text x="24" y="276" font-size="15.5" fill="#263238">Never bend, puncture or heat it.</text>
  </g>
  <!-- 2 ESD -->
  <g transform="translate(420,115)">
    <rect width="360" height="300" rx="20" fill="#fff" stroke="#bbdefb" stroke-width="2" filter="url(#sh)"/>
    <rect width="360" height="150" rx="20" fill="#e3f2fd"/><rect y="130" width="360" height="20" fill="#e3f2fd"/>
    <g transform="translate(60,22)">
      <rect x="0" y="80" width="240" height="22" rx="6" fill="#1e88e5" opacity=".35"/>
      <path d="M40 80 C40 40 70 20 110 24 L150 30 C160 32 160 46 150 48 L118 48" fill="#ffccbc" stroke="#bf8a6f" stroke-width="2"/>
      <rect x="66" y="40" width="22" height="34" rx="4" fill="#1565c0"/>
      <path d="M77 74 C80 100 150 110 200 92" stroke="#1565c0" stroke-width="4" fill="none" stroke-dasharray="1 0"/>
      <circle cx="202" cy="91" r="7" fill="#1565c0"/>
      <path d="M210 30 l-14 22 h12 l-10 22" stroke="#ffb300" stroke-width="4" fill="none" stroke-linejoin="round"/>
      <path d="M196 26 l26 52" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle cx="36" cy="186" r="18" fill="#1565c0"/><text x="36" y="192" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">2</text>
    <text x="64" y="193" font-size="21" font-weight="700" fill="#1565c0">Static (ESD)</text>
    <text x="24" y="232" font-size="15.5" fill="#263238">Work on an anti-static mat with a</text>
    <text x="24" y="254" font-size="15.5" fill="#263238">grounded wrist strap. Touch the mat</text>
    <text x="24" y="276" font-size="15.5" fill="#263238">before you touch the board.</text>
  </g>
  <!-- 3 Heat -->
  <g transform="translate(800,115)">
    <rect width="360" height="300" rx="20" fill="#fff" stroke="#ffe0b2" stroke-width="2" filter="url(#sh)"/>
    <rect width="360" height="150" rx="20" fill="#fff3e0"/><rect y="130" width="360" height="20" fill="#fff3e0"/>
    <g transform="translate(120,14)">
      <rect x="40" y="0" width="36" height="52" rx="6" fill="#455a64"/><path d="M36 52 h44 l-8 30 h-28 z" fill="url(#metal)" stroke="#607d8b"/>
      <g stroke="#ff5722" stroke-width="4" stroke-linecap="round"><path d="M50 90 l-8 24"/><path d="M58 90 v26"/><path d="M66 90 l8 24"/></g>
      <rect x="-10" y="118" width="136" height="10" rx="3" fill="#2e7d32"/><rect x="34" y="110" width="48" height="10" rx="2" fill="#263238"/>
      <path d="M-30 30 q10 -14 0 -28 M-14 30 q10 -14 0 -28" stroke="#ff7043" stroke-width="3" fill="none" opacity=".7"/>
    </g>
    <circle cx="36" cy="186" r="18" fill="#e65100"/><text x="36" y="192" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">3</text>
    <text x="64" y="193" font-size="21" font-weight="700" fill="#e65100">Control heat</text>
    <text x="24" y="232" font-size="15.5" fill="#263238">Lowest temperature that works.</text>
    <text x="24" y="254" font-size="15.5" fill="#263238">Shield plastic and the battery. Park</text>
    <text x="24" y="276" font-size="15.5" fill="#263238">the iron and hot air in their stands.</text>
  </g>
  <!-- 4 Fumes & fire -->
  <g transform="translate(40,435)">
    <rect width="360" height="300" rx="20" fill="#fff" stroke="#cfd8dc" stroke-width="2" filter="url(#sh)"/>
    <rect width="360" height="150" rx="20" fill="#eceff1"/><rect y="130" width="360" height="20" fill="#eceff1"/>
    <g transform="translate(70,20)">
      <rect x="0" y="50" width="60" height="70" rx="8" fill="#e3f2fd" stroke="#90a4ae" stroke-width="2"/><rect x="18" y="34" width="24" height="18" rx="3" fill="#90a4ae"/>
      <text x="30" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#1565c0">IPA</text>
      <path d="M44 100 h0" />
      <path d="M100 118 C90 100 110 90 104 70 C120 82 126 96 120 110 C130 104 132 92 130 86 C142 100 142 118 120 124 Z" fill="#ff7043"/>
      <path d="M112 122 C108 112 116 106 114 98 C122 106 124 114 118 122 Z" fill="#ffca28"/>
      <circle cx="190" cy="70" r="40" fill="#78909c"/><circle cx="190" cy="70" r="30" fill="#b0bec5"/>
      <g stroke="#546e7a" stroke-width="4"><path d="M190 44 v52"/><path d="M164 70 h52"/><path d="M172 52 l36 36"/><path d="M208 52 l-36 36"/></g>
      <path d="M150 128 q10 -20 -2 -40" stroke="#90a4ae" stroke-width="3" fill="none" opacity=".7"/>
    </g>
    <circle cx="36" cy="186" r="18" fill="#455a64"/><text x="36" y="192" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">4</text>
    <text x="64" y="193" font-size="21" font-weight="700" fill="#455a64">Fumes and fire</text>
    <text x="24" y="232" font-size="15.5" fill="#263238">Use a fume extractor. IPA burns:</text>
    <text x="24" y="254" font-size="15.5" fill="#263238">keep it away from hot air. Keep a</text>
    <text x="24" y="276" font-size="15.5" fill="#263238">CO2 or powder extinguisher nearby.</text>
  </g>
  <!-- 5 Eyes -->
  <g transform="translate(420,435)">
    <rect width="360" height="300" rx="20" fill="#fff" stroke="#b2dfdb" stroke-width="2" filter="url(#sh)"/>
    <rect width="360" height="150" rx="20" fill="#e0f2f1"/><rect y="130" width="360" height="20" fill="#e0f2f1"/>
    <g transform="translate(70,40)">
      <path d="M0 30 C0 10 20 0 50 0 H90 C100 0 105 8 110 14 C115 8 120 0 130 0 H170 C200 0 220 10 220 30 V48 C220 70 200 80 176 80 H146 C126 80 118 62 110 48 C102 62 94 80 74 80 H44 C20 80 0 70 0 48 Z" fill="#80cbc4" fill-opacity=".55" stroke="#00796b" stroke-width="5"/>
      <path d="M24 18 l30 0" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/><path d="M140 18 l30 0" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
      <path d="M-20 22 h20 M220 22 h20" stroke="#00796b" stroke-width="5"/>
    </g>
    <circle cx="36" cy="186" r="18" fill="#00796b"/><text x="36" y="192" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">5</text>
    <text x="64" y="193" font-size="21" font-weight="700" fill="#00796b">Protect your eyes</text>
    <text x="24" y="232" font-size="15.5" fill="#263238">Wear safety glasses when separating</text>
    <text x="24" y="254" font-size="15.5" fill="#263238">glass, cutting wire or removing a</text>
    <text x="24" y="276" font-size="15.5" fill="#263238">swollen battery.</text>
  </g>
  <!-- 6 Clean hands / bench -->
  <g transform="translate(800,435)">
    <rect width="360" height="300" rx="20" fill="#fff" stroke="#e1bee7" stroke-width="2" filter="url(#sh)"/>
    <rect width="360" height="150" rx="20" fill="#f3e5f5"/><rect y="130" width="360" height="20" fill="#f3e5f5"/>
    <g transform="translate(80,22)">
      <path d="M20 40 h60 l-8 70 h-44 z" fill="#fff" stroke="#8e24aa" stroke-width="4"/><path d="M80 56 c18 0 18 30 0 30" stroke="#8e24aa" stroke-width="4" fill="none"/>
      <path d="M40 34 q5 -8 0 -14 M56 34 q5 -8 0 -14" stroke="#ab47bc" stroke-width="3" fill="none"/>
      <circle cx="52" cy="72" r="50" fill="none" stroke="#c62828" stroke-width="7"/><path d="M17 37 L87 107" stroke="#c62828" stroke-width="7"/>
      <rect x="150" y="50" width="80" height="60" rx="6" fill="#2e7d32"/><rect x="160" y="60" width="26" height="18" fill="#cfd8dc"/><rect x="196" y="82" width="22" height="16" fill="#212121"/>
      <path d="M156 118 h68" stroke="#8e24aa" stroke-width="3" stroke-dasharray="6 5"/>
    </g>
    <circle cx="36" cy="186" r="18" fill="#8e24aa"/><text x="36" y="192" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">6</text>
    <text x="64" y="193" font-size="21" font-weight="700" fill="#8e24aa">Clean bench, clean hands</text>
    <text x="24" y="232" font-size="15.5" fill="#263238">No food or drinks near an open</text>
    <text x="24" y="254" font-size="15.5" fill="#263238">phone. Hold boards by the edges.</text>
    <text x="24" y="276" font-size="15.5" fill="#263238">Wash hands after using solder.</text>
  </g>
</svg>
