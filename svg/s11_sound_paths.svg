<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Where is the sound fault? Test each path on its own</text>
<text x="40" y="84" font-size="17" fill="#55657a">If one path fails and the others work, the fault is in that path only. If all fail, think codec, software or liquid.</text>
