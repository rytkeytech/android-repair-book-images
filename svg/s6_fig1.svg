<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 6.1  Finding a short with voltage injection</text>
<text x="40" y="84" font-size="17" fill="#55657a">Start low (about 1 V) and never go above the line's normal voltage. The shorted part heats first.</text>
<text x="40" y="618" font-size="15" fill="#55657a">Find the hot part with rosin, a thermal camera, alcohol or your fingertip.</text>
