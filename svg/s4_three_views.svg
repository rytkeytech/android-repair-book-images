<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Schematic, board view and bitmap: three ways to see one circuit</text>
<text x="40" y="84" font-size="17" fill="#55657a">Professionals use the schematic to understand and the board view to locate. Open both at the same time.</text>
<rect x="40" y="110" width="360" height="400" rx="18" fill="#fff" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="220" y="152" font-size="22" fill="#1565C0" font-weight="800" text-anchor="middle">SCHEMATIC</text>
<text x="220" y="178" font-size="15" fill="#55657a" font-weight="400" text-anchor="middle">how parts connect</text>
<rect x="420" y="110" width="360" height="400" rx="18" fill="#fff" stroke="#ce93d8" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="600" y="152" font-size="22" fill="#6A1B9A" font-weight="800" text-anchor="middle">BOARD VIEW</text>
<text x="600" y="178" font-size="15" fill="#55657a" font-weight="400" text-anchor="middle">where parts sit</text>
<rect x="800" y="110" width="360" height="400" rx="18" fill="#fff" stroke="#a5d6a7" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="980" y="152" font-size="22" fill="#2E7D32" font-weight="800" text-anchor="middle">BITMAP</text>
<text x="980" y="178" font-size="15" fill="#55657a" font-weight="400" text-anchor="middle">photo-like map with values</text>
