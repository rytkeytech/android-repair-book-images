<text x="1070" y="270" font-size="11" fill="#cfd8dc" font-weight="700" text-anchor="middle">U1201</text>
<text x="980" y="470" font-size="16" fill="#263238" font-weight="400" text-anchor="middle"><tspan x="980" dy="0">Looks like the real board,</tspan><tspan x="980" dy="21.6">with part values printed.</tspan><tspan x="980" dy="21.6">Good for quick checks.</tspan></text></svg>