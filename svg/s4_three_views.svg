<text x="308" y="312" font-size="13" fill="#1a237e" font-weight="600" text-anchor="start">C1202</text>
<text x="220" y="470" font-size="16" fill="#263238" font-weight="400" text-anchor="middle"><tspan x="220" dy="0">Symbols and net names.</tspan><tspan x="220" dy="21.6">Use it to understand</tspan><tspan x="220" dy="21.6">how the circuit works.</tspan></text>
