<text x="600" y="470" font-size="16" fill="#263238" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Real positions. Click a pin</tspan><tspan x="600" dy="21.6">and its whole net lights up.</tspan><tspan x="600" dy="21.6">Use it to find the part.</tspan></text>
