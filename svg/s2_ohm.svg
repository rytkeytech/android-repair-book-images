<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Inter, DejaVu Sans, sans-serif"><defs>
<linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7d46"/><stop offset="1" stop-color="#1b5631"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa4ad"/><stop offset=".5" stop-color="#eef1f3"/><stop offset="1" stop-color="#8a949d"/></linearGradient>
<linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f5f7"/><stop offset="1" stop-color="#aab3bb"/></linearGradient>
<linearGradient id="dev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset="1" stop-color="#b8c3cb"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5d68"/><stop offset="1" stop-color="#263238"/></linearGradient>
<linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd54f"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4a5c"/><stop offset=".5" stop-color="#121a24"/><stop offset="1" stop-color="#05080c"/></linearGradient>
<linearGradient id="batt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b4652"/><stop offset="1" stop-color="#1f262e"/></linearGradient>
<linearGradient id="copper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c06a"/><stop offset="1" stop-color="#b8892e"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64b5f6"/><stop offset="1" stop-color="#1e88e5"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1a2b" flood-opacity=".18"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1a2b" flood-opacity=".25"/></filter>
<marker id="a0D2847" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0D2847"/></marker><marker id="aE65100" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E65100"/></marker><marker id="a1565C0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1565C0"/></marker><marker id="a2E7D32" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aC62828" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C62828"/></marker><marker id="a6A1B9A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6A1B9A"/></marker><marker id="a00796B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00796B"/></marker><marker id="a546E7A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#546E7A"/></marker><marker id="a1d1d1f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f"/></marker><marker id="aff5722" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5722"/></marker><marker id="affffff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="660" fill="#fff"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Ohm's law triangle and a worked example</text>
<text x="40" y="84" font-size="17" fill="#55657a">Cover the value you want to find. What is left shows the formula.</text>
<g filter="url(#sh)"><path d="M300 120 L520 500 L80 500 Z" fill="#fff" stroke="#0D2847" stroke-width="4"/></g>
<path d="M300 120 L410 310 L190 310 Z" fill="#e3f2fd"/>
<path d="M190 310 L300 310 L300 500 L80 500 Z" fill="#fff3e0"/>
<path d="M300 310 L410 310 L520 500 L300 500 Z" fill="#e8f5e9"/>
<path d="M300 120 L520 500 L80 500 Z" fill="none" stroke="#0D2847" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<line x1="190" y1="310" x2="410" y2="310" stroke="#0D2847" stroke-width="4" stroke-linecap="round"/>
<line x1="300" y1="310" x2="300" y2="500" stroke="#0D2847" stroke-width="4" stroke-linecap="round"/>
<text x="300" y="270" font-size="64" fill="#1565C0" font-weight="800" text-anchor="middle">V</text>
<text x="225" y="445" font-size="60" fill="#E65100" font-weight="800" text-anchor="middle">I</text>
<text x="375" y="445" font-size="60" fill="#2E7D32" font-weight="800" text-anchor="middle">R</text>
<text x="300" y="290" font-size="14" fill="#1565C0" font-weight="600" text-anchor="middle">volts</text>
<text x="225" y="470" font-size="14" fill="#E65100" font-weight="600" text-anchor="middle">amps</text>
<text x="375" y="470" font-size="14" fill="#2E7D32" font-weight="600" text-anchor="middle">ohms</text>
<rect x="600" y="140" width="560" height="62" rx="12" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" opacity="1"/>
<text x="624" y="180" font-size="26" fill="#1565C0" font-weight="800" text-anchor="start">V = I × R</text>
<text x="800" y="178" font-size="16" fill="#37474f" font-weight="400" text-anchor="start">voltage = current × resistance</text>
<rect x="600" y="218" width="560" height="62" rx="12" fill="#fff3e0" stroke="#ffcc80" stroke-width="2" opacity="1"/>
<text x="624" y="258" font-size="26" fill="#E65100" font-weight="800" text-anchor="start">I = V ÷ R</text>
<text x="800" y="256" font-size="16" fill="#37474f" font-weight="400" text-anchor="start">current = voltage ÷ resistance</text>
<rect x="600" y="296" width="560" height="62" rx="12" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="2" opacity="1"/>
<text x="624" y="336" font-size="26" fill="#2E7D32" font-weight="800" text-anchor="start">R = V ÷ I</text>
<text x="800" y="334" font-size="16" fill="#37474f" font-weight="400" text-anchor="start">resistance = voltage ÷ current</text>
<rect x="600" y="390" width="560" height="200" rx="16" fill="#fff" stroke="#ffcc80" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="600" y="390" width="8" height="200" rx="4" fill="#E65100" stroke="none" stroke-width="2" opacity="1"/>
<text x="630" y="428" font-size="18" fill="#E65100" font-weight="700" text-anchor="start">Worked example</text>
<text x="630" y="462" font-size="16" fill="#1d1d1f" font-weight="400" text-anchor="start">A 3.8 V supply is connected across a 10 Ω resistor.</text>
<text x="630" y="500" font-size="19" fill="#0D2847" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono">I = V ÷ R = 3.8 ÷ 10 = 0.38 A (380 mA)</text>
<text x="630" y="540" font-size="16" fill="#C62828" font-weight="600" text-anchor="start">A short circuit has almost no resistance,</text>
<text x="630" y="563" font-size="16" fill="#C62828" font-weight="600" text-anchor="start">so the current becomes very large.</text></svg>