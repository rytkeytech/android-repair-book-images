<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Customer data: do and don't</text>
<text x="40" y="84" font-size="17" fill="#55657a">In Ghana, the Data Protection Act 2012 (Act 843) protects personal data. Trust is your best advert.</text>
<rect x="40" y="110" width="550" height="360" rx="18" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="315" y="160" font-size="26" fill="#2E7D32" font-weight="800" text-anchor="middle">DO</text>
<circle cx="90" cy="220" r="15" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M83.25 220 L88.5 225.7 L97.5 214.75" fill="none" stroke="#fff" stroke-width="3.3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="120" y="227" font-size="17" fill="#263238" font-weight="400" text-anchor="start">Ask the customer to back up first</text>
<circle cx="90" cy="282" r="15" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M83.25 282 L88.5 287.7 L97.5 276.75" fill="none" stroke="#fff" stroke-width="3.3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="120" y="289" font-size="17" fill="#263238" font-weight="400" text-anchor="start">Ask for the PIN only if testing needs it</text>
<circle cx="90" cy="344" r="15" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M83.25 344 L88.5 349.7 L97.5 338.75" fill="none" stroke="#fff" stroke-width="3.3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="120" y="351" font-size="17" fill="#263238" font-weight="400" text-anchor="start">Keep screens out of other customers' view</text>
<circle cx="90" cy="406" r="15" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M83.25 406 L88.5 411.7 L97.5 400.75" fill="none" stroke="#fff" stroke-width="3.3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="120" y="413" font-size="17" fill="#263238" font-weight="400" text-anchor="start">Return the phone as you received it</text>
<rect x="610" y="110" width="550" height="360" rx="18" fill="#ffebee" stroke="#ef9a9a" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="885" y="160" font-size="26" fill="#C62828" font-weight="800" text-anchor="middle">DON'T</text>
<circle cx="660" cy="220" r="15" fill="#C62828" stroke="none" stroke-width="2"/><path d="M654.3 214.3 L665.7 225.7 M665.7 214.3 L654.3 225.7" fill="none" stroke="#fff" stroke-width="3.3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="690" y="227" font-size="17" fill="#263238" font-weight="400" text-anchor="start">Open photos, chats or files</text>
<circle cx="660" cy="282" r="15" fill="#C62828" stroke="none" stroke-width="2"/><path d="M654.3 276.3 L665.7 287.7 M665.7 276.3 L654.3 287.7" fill="none" stroke="#fff" stroke-width="3.3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="690" y="289" font-size="17" fill="#263238" font-weight="400" text-anchor="start">Copy or keep any customer data</text>
