<text x="690" y="351" font-size="17" fill="#263238" font-weight="400" text-anchor="start">Leave unlocked phones on the counter</text>
<circle cx="660" cy="406" r="15" fill="#C62828" stroke="none" stroke-width="2"/><path d="M654.3 400.3 L665.7 411.7 M665.7 400.3 L654.3 411.7" fill="none" stroke="#fff" stroke-width="3.3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="690" y="413" font-size="17" fill="#263238" font-weight="400" text-anchor="start">Share a customer's number or details</text></svg>