<text x="930" y="350" font-size="15.5" fill="#263238" font-weight="600" text-anchor="start"><tspan x="930" dy="0">Logo shows, then</tspan><tspan x="930" dy="20.925">restarts again</tspan><tspan x="930" dy="20.925">and again</tspan></text>
