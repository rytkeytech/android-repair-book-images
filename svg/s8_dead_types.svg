<text x="170" y="350" font-size="15.5" fill="#263238" font-weight="600" text-anchor="start"><tspan x="170" dy="0">No vibration, no sound,</tspan><tspan x="170" dy="20.925">no heat, 0 mA</tspan></text>
<line x1="60" y1="494" x2="380" y2="494" stroke="#eceff1" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="524" font-size="14" fill="#C62828" font-weight="800" text-anchor="start">Look at:</text>
<text x="140" y="524" font-size="15" fill="#263238" font-weight="400" text-anchor="start"><tspan x="140" dy="0">Power path, short,</tspan><tspan x="140" dy="20.25">PMIC, CPU</tspan></text>
