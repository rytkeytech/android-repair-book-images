<text x="550" y="350" font-size="15.5" fill="#263238" font-weight="600" text-anchor="start"><tspan x="550" dy="0">Vibrates or rings,</tspan><tspan x="550" dy="20.925">PC detects it,</tspan><tspan x="550" dy="20.925">screen stays black</tspan></text>
