<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Dead, no display, or boot loop? Sort the phone first</text>
<text x="40" y="84" font-size="17" fill="#55657a">Each one needs a different path. Do not open the phone until you know which one you have.</text>
<rect x="430" y="110" width="340" height="64" rx="12" fill="#0D2847" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="600.0" y="147.95" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">Press power, plug in the charger</text>
