<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Replacing a screen the right way</text>
<text x="40" y="84" font-size="17" fill="#55657a">Testing the new screen before gluing saves you from sealing a faulty screen into the phone.</text>
<rect x="40" y="140" width="160" height="96" rx="12" fill="#2E7D32" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="120.0" y="183.41" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="120.0" dy="0">Test the new</tspan><tspan x="120.0" dy="21.25">screen first</tspan></text><circle cx="58" cy="142" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="58" y="146.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="120.0" y="262" font-size="14" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="120.0" dy="0">plug in loosely,</tspan><tspan x="120.0" dy="18.900000000000002">battery connected last</tspan></text><line x1="205" y1="188.0" x2="227" y2="188.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="232" y="140" width="160" height="96" rx="12" fill="#1565C0" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="312.0" y="183.41" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="312.0" dy="0">Heat and</tspan><tspan x="312.0" dy="21.25">open</tspan></text><circle cx="250" cy="142" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="250" y="146.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="312.0" y="262" font-size="14" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="312.0" dy="0">80–100 °C, slow</tspan><tspan x="312.0" dy="18.900000000000002">pry, no metal tools</tspan></text><line x1="397" y1="188.0" x2="419" y2="188.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="424" y="140" width="160" height="96" rx="12" fill="#C62828" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="504.0" y="183.41" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="504.0" dy="0">Battery</tspan><tspan x="504.0" dy="21.25">off</tspan></text><circle cx="442" cy="142" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="442" y="146.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="504.0" y="262" font-size="14" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="504.0" dy="0">always before</tspan><tspan x="504.0" dy="18.900000000000002">unplugging the screen</tspan></text><line x1="589" y1="188.0" x2="611" y2="188.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="616" y="140" width="160" height="96" rx="12" fill="#1565C0" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="696.0" y="183.41" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="696.0" dy="0">Clean the</tspan><tspan x="696.0" dy="21.25">frame</tspan></text><circle cx="634" cy="142" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="634" y="146.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="696.0" y="262" font-size="14" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="696.0" dy="0">remove old glue</tspan><tspan x="696.0" dy="18.900000000000002">and dust</tspan></text><line x1="781" y1="188.0" x2="803" y2="188.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="808" y="140" width="160" height="96" rx="12" fill="#1565C0" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="888.0" y="183.41" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="888.0" dy="0">Fit +</tspan><tspan x="888.0" dy="21.25">glue</tspan></text><circle cx="826" cy="142" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="826" y="146.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="888.0" y="262" font-size="14" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="888.0" dy="0">B-7000 or tape,</tspan><tspan x="888.0" dy="18.900000000000002">clamp evenly</tspan></text><line x1="973" y1="188.0" x2="995" y2="188.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="1000" y="140" width="160" height="96" rx="12" fill="#2E7D32" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="1080.0" y="183.41" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="1080.0" dy="0">Final</tspan><tspan x="1080.0" dy="21.25">test</tspan></text><circle cx="1018" cy="142" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="1018" y="146.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="1080.0" y="262" font-size="14" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="1080.0" dy="0">touch, display,</tspan><tspan x="1080.0" dy="18.900000000000002">sensors, camera</tspan></text></svg>