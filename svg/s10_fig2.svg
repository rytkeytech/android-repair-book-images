<circle cx="60" cy="510" r="13" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="60" y="514.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="86" y="516" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">VBAT into the coil: battery voltage. If missing, check the fuse or path from VBAT.</text>
<circle cx="60" cy="550" r="13" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="60" y="554.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="86" y="556" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">Coil: check continuity (should beep). An open coil means no backlight.</text>
<circle cx="60" cy="590" r="13" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="60" y="594.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="86" y="596" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">LED+: about 15–25 V with the screen on. In diode mode it should not read 0 (shorted capacitor or diode).</text>
<circle cx="60" cy="630" r="13" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="60" y="634.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<text x="86" y="636" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">LED–: low voltage with the screen on. LED+ high but no light? The LCD's LEDs or the connector are faulty.</text>
<text x="40" y="690" font-size="15" fill="#55657a" font-weight="400" text-anchor="start">Also check the Schottky diode in diode mode (one way only) and the output capacitor for a short.</text></svg>