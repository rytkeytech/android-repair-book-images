<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 10.2  LCD backlight boost circuit (typical)</text>
<text x="40" y="84" font-size="17" fill="#55657a">The driver switches the coil on and off very fast to boost about 3.8 V up to 15–25 V for the LEDs.</text>
