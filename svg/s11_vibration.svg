<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Two kinds of vibration motor</text>
<text x="40" y="84" font-size="17" fill="#55657a">No vibration but sound works? Check the motor contacts first, then the motor, then the driver line.</text>
<rect x="40" y="100" width="550" height="290" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/>
<circle cx="170" cy="245" r="80" fill="url(#metal)" stroke="#78909c" stroke-width="3"/>
<circle cx="170" cy="245" r="30" fill="#90a4ae" stroke="none" stroke-width="2"/>
<path d="M100 200 a80 80 0 0 1 40 -30" fill="none" stroke="#E65100" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#aE65100)"/>
<line x1="220" y1="300" x2="250" y2="330" stroke="#C62828" stroke-width="3" stroke-linecap="round"/>
<line x1="200" y1="310" x2="226" y2="340" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
<text x="310" y="180" font-size="20" fill="#0D2847" font-weight="800" text-anchor="start">Coin motor (ERM)</text>
<text x="310" y="220" font-size="16" fill="#263238" font-weight="400" text-anchor="start"><tspan x="310" dy="0">Two wires or pads.</tspan><tspan x="310" dy="21.6">DC voltage makes it spin.</tspan><tspan x="310" dy="21.6">Test with 2–3 V from the PSU.</tspan></text>
<rect x="610" y="100" width="550" height="290" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="650" y="200" width="180" height="90" rx="14" fill="url(#metal)" stroke="#78909c" stroke-width="3" opacity="1"/>
<rect x="680" y="228" width="120" height="34" rx="8" fill="#90a4ae" stroke="none" stroke-width="2" opacity="1"/>
<path d="M670 180 h140" fill="none" stroke="#E65100" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#aE65100)"/>
<path d="M810 180 h-140" fill="none" stroke="#E65100" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#aE65100)"/>
<text x="880" y="180" font-size="20" fill="#0D2847" font-weight="800" text-anchor="start">Linear motor (LRA)</text>
<text x="880" y="220" font-size="16" fill="#263238" font-weight="400" text-anchor="start"><tspan x="880" dy="0">Needs an AC drive signal</tspan><tspan x="880" dy="21.6">from a driver IC.</tspan><tspan x="880" dy="21.6">Test the coil: a few ohms.</tspan></text></svg>