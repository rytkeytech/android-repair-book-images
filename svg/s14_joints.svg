<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Good and bad solder joints</text>
<text x="40" y="84" font-size="17" fill="#55657a">Check every joint under the microscope. Cold joints and bridges cause most 'repair did not work' returns.</text>
