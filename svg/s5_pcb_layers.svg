<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">How a phone board is built: many thin layers</text>
<text x="40" y="84" font-size="17" fill="#55657a">A cross-section through a motherboard. Phone boards often have 8 to 12 copper layers.</text>
<text x="40" y="558" font-size="15" fill="#55657a">A track can run inside the board where you cannot see it. That is why a line can be broken with no visible damage.</text>
