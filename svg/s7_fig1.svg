<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 7.1  Connecting a phone board to the DC power supply</text>
<text x="40" y="84" font-size="17" fill="#55657a">Set 4.0 V and a current limit of about 1–2 A. Check polarity before you switch on.</text>
<text x="40" y="578" font-size="15" fill="#55657a">Use a boot cable for the model, or fine clips on the battery connector pins.</text>
