<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Isolation method: split the line to find which side is shorted</text>
<text x="40" y="84" font-size="17" fill="#55657a">Lift a coil or 0 Ω link in the middle, then measure both sides in diode mode.</text>
<text x="40" y="538" font-size="15" fill="#55657a">Keep splitting the bad side until only one part is left.</text>
