<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 9.3  How the battery talks to the phone (typical modern battery)</text>
<text x="40" y="84" font-size="17" fill="#55657a">Older phones may have only BAT+, BAT–, NTC and ID. Pin names differ by brand: always confirm with the schematic.</text>
