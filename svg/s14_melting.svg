<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Melting points: why the right solder matters</text>
<text x="40" y="84" font-size="17" fill="#55657a">Adding leaded solder to factory lead-free joints lowers their melting point, so parts come off with less heat.</text>
<text x="370" y="164" font-size="17" fill="#263238" font-weight="700" text-anchor="end">Low-temp paste (Sn-Bi)</text>
<rect x="390" y="136" width="276.0" height="44" rx="22" fill="#00796B" stroke="none" stroke-width="2" opacity="1"/>
<text x="676.0" y="166" font-size="19" fill="#00796B" font-weight="800" text-anchor="start">138 °C</text>
<text x="370" y="240" font-size="17" fill="#263238" font-weight="700" text-anchor="end">Leaded solder (Sn63/Pb37)</text>
<rect x="390" y="212" width="366.0" height="44" rx="22" fill="#1565C0" stroke="none" stroke-width="2" opacity="1"/>
<text x="766.0" y="242" font-size="19" fill="#1565C0" font-weight="800" text-anchor="start">183 °C</text>
<text x="370" y="316" font-size="17" fill="#263238" font-weight="700" text-anchor="end">Lead-free (SAC305), factory</text>
<rect x="390" y="288" width="434.0" height="44" rx="22" fill="#E65100" stroke="none" stroke-width="2" opacity="1"/>
<text x="834.0" y="318" font-size="19" fill="#E65100" font-weight="800" text-anchor="start">217 °C</text>
<text x="370" y="392" font-size="17" fill="#263238" font-weight="700" text-anchor="end">Typical iron setting</text>
<rect x="390" y="364" width="660.0" height="44" rx="22" fill="#C62828" stroke="none" stroke-width="2" opacity="1"/>
<text x="1060.0" y="394" font-size="19" fill="#C62828" font-weight="800" text-anchor="start">330 °C</text></svg>