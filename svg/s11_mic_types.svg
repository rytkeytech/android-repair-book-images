<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Two kinds of microphone</text>
<rect x="40" y="100" width="550" height="360" rx="18" fill="#fff" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="315" y="144" font-size="20" fill="#1565C0" font-weight="800" text-anchor="middle">ANALOG MIC (2 pins)</text>
<rect x="100" y="200" width="130" height="110" rx="10" fill="#b0bec5" stroke="#546e7a" stroke-width="2" opacity="1"/>
<circle cx="165" cy="255" r="20" fill="#263238" stroke="none" stroke-width="2"/>
<circle cx="165" cy="255" r="8" fill="#546e7a" stroke="none" stroke-width="2"/>
<line x1="230" y1="210.0" x2="360" y2="210.0" stroke="#C62828" stroke-width="3" stroke-linecap="round"/>
<circle cx="360" cy="210.0" r="5" fill="#C62828" stroke="none" stroke-width="2"/>
<text x="374" y="216.0" font-size="16" fill="#C62828" font-weight="800" text-anchor="start">MIC_P</text>
<line x1="230" y1="300.0" x2="360" y2="300.0" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
<circle cx="360" cy="300.0" r="5" fill="#1d1d1f" stroke="none" stroke-width="2"/>
<text x="374" y="306.0" font-size="16" fill="#1d1d1f" font-weight="800" text-anchor="start">MIC_N / GND</text>
<text x="315" y="380" font-size="16" fill="#263238" font-weight="400" text-anchor="middle"><tspan x="315" dy="0">Bias voltage about 1.8–2.2 V on</tspan><tspan x="315" dy="21.6">MIC_P while recording.</tspan></text>
<rect x="610" y="100" width="550" height="360" rx="18" fill="#fff" stroke="#ce93d8" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="885" y="144" font-size="20" fill="#6A1B9A" font-weight="800" text-anchor="middle">DIGITAL MEMS MIC (4–5 pins)</text>
<rect x="670" y="200" width="130" height="110" rx="10" fill="#b0bec5" stroke="#546e7a" stroke-width="2" opacity="1"/>
<circle cx="735" cy="255" r="20" fill="#263238" stroke="none" stroke-width="2"/>
<circle cx="735" cy="255" r="8" fill="#546e7a" stroke="none" stroke-width="2"/>
<line x1="800" y1="210.0" x2="930" y2="210.0" stroke="#C62828" stroke-width="3" stroke-linecap="round"/>
<circle cx="930" cy="210.0" r="5" fill="#C62828" stroke="none" stroke-width="2"/>
<text x="944" y="216.0" font-size="16" fill="#C62828" font-weight="800" text-anchor="start">VDD 1.8 V</text>
<line x1="800" y1="240.0" x2="930" y2="240.0" stroke="#1565C0" stroke-width="3" stroke-linecap="round"/>
<circle cx="930" cy="240.0" r="5" fill="#1565C0" stroke="none" stroke-width="2"/>
<text x="944" y="246.0" font-size="16" fill="#1565C0" font-weight="800" text-anchor="start">CLK</text>
<line x1="800" y1="270.0" x2="930" y2="270.0" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
<circle cx="930" cy="270.0" r="5" fill="#2E7D32" stroke="none" stroke-width="2"/>
<text x="944" y="276.0" font-size="16" fill="#2E7D32" font-weight="800" text-anchor="start">DATA</text>
<line x1="800" y1="300.0" x2="930" y2="300.0" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
<circle cx="930" cy="300.0" r="5" fill="#1d1d1f" stroke="none" stroke-width="2"/>
<text x="944" y="306.0" font-size="16" fill="#1d1d1f" font-weight="800" text-anchor="start">GND</text>
<text x="885" y="380" font-size="16" fill="#263238" font-weight="400" text-anchor="middle"><tspan x="885" dy="0">Needs power AND a clock.</tspan><tspan x="885" dy="21.6">Check VDD and CLK while recording.</tspan></text></svg>