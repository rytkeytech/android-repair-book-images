<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Cold test and hot test</text>
<text x="40" y="84" font-size="17" fill="#55657a">Two ways to measure a board. Always do the cold test first.</text>
<text x="40" y="538" font-size="15" fill="#55657a">Measuring resistance or diode mode with power ON gives false readings and can damage the meter.</text>
