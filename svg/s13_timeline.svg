<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Liquid damage gets worse with time: act fast</text>
<text x="40" y="84" font-size="17" fill="#55657a">Tell the customer: switch off, do not charge, do not use rice or a hair dryer, bring it in quickly.</text>
