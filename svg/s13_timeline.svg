<text x="340" y="196" font-size="18" fill="#E65100" font-weight="800" text-anchor="middle">minutes</text>
<text x="340" y="300" font-size="15" fill="#263238" font-weight="400" text-anchor="middle"><tspan x="340" dy="0">current flows,</tspan><tspan x="340" dy="20.25">parts burn</tspan></text>
<circle cx="600" cy="241" r="24" fill="#8d6e4a" stroke="#fff" stroke-width="4"/>
<text x="600" y="196" font-size="18" fill="#8d6e4a" font-weight="800" text-anchor="middle">hours</text>
<text x="600" y="300" font-size="15" fill="#263238" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">corrosion starts</tspan><tspan x="600" dy="20.25">under chips</tspan></text>
