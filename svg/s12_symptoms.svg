<rect x="40" y="366" width="430" height="68" rx="14" fill="#6A1B9A" stroke="none" stroke-width="2" opacity="1"/>
<rect x="450" y="366" width="20" height="68" rx="0" fill="#6A1B9A" stroke="none" stroke-width="2" opacity="1"/>
<text x="64" y="408" font-size="17.5" fill="#fff" font-weight="800" text-anchor="start">Wi-Fi or Bluetooth won't turn on</text>
