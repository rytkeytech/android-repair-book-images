<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Network symptoms and where to look</text>
<text x="40" y="84" font-size="17" fill="#55657a">Network faults are easy to confuse with carrier or account problems: always test with a known-good SIM first.</text>
<rect x="40" y="120" width="1120" height="68" rx="14" fill="#fff" stroke="#ef9a9a" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="40" y="120" width="430" height="68" rx="14" fill="#C62828" stroke="none" stroke-width="2" opacity="1"/>
<rect x="450" y="120" width="20" height="68" rx="0" fill="#C62828" stroke="none" stroke-width="2" opacity="1"/>
<text x="64" y="162" font-size="17.5" fill="#fff" font-weight="800" text-anchor="start">No SIM / SIM not detected</text>
<line x1="480" y1="154" x2="520" y2="154" stroke="#C62828" stroke-width="3" stroke-linecap="round" marker-end="url(#aC62828)"/>
<text x="536" y="161" font-size="17" fill="#263238" font-weight="600" text-anchor="start">SIM tray, reader pins, the SIM card, SIM lines</text>
