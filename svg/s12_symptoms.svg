<rect x="40" y="202" width="430" height="68" rx="14" fill="#E65100" stroke="none" stroke-width="2" opacity="1"/>
<rect x="450" y="202" width="20" height="68" rx="0" fill="#E65100" stroke="none" stroke-width="2" opacity="1"/>
<text x="64" y="244" font-size="17.5" fill="#fff" font-weight="800" text-anchor="start">No service, SIM detected</text>
<line x1="480" y1="236" x2="520" y2="236" stroke="#E65100" stroke-width="3" stroke-linecap="round" marker-end="url(#aE65100)"/>
<text x="536" y="243" font-size="17" fill="#263238" font-weight="600" text-anchor="start">Antenna, coax, RF section, baseband, IMEI</text>
<rect x="40" y="284" width="1120" height="68" rx="14" fill="#fff" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="40" y="284" width="430" height="68" rx="14" fill="#1565C0" stroke="none" stroke-width="2" opacity="1"/>
<rect x="450" y="284" width="20" height="68" rx="0" fill="#1565C0" stroke="none" stroke-width="2" opacity="1"/>
<text x="64" y="326" font-size="17.5" fill="#fff" font-weight="800" text-anchor="start">Weak or dropping signal</text>
<line x1="480" y1="318" x2="520" y2="318" stroke="#1565C0" stroke-width="3" stroke-linecap="round" marker-end="url(#a1565C0)"/>
<text x="536" y="325" font-size="17" fill="#263238" font-weight="600" text-anchor="start">Antenna contacts, coax, PA, metal case or cover</text>
