ds one way only</text><circle cx="830" cy="712" r="11" fill="#C62828" stroke="none" stroke-width="2"/><path d="M825.82 707.82 L834.18 716.18 M834.18 707.82 L825.82 716.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="850" y="717" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start"><tspan x="850" dy="0">0 both ways = shorted</tspan><tspan x="850" dy="18.85">(common after a bad charger)</tspan></text></svg>