<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">How to test components (1 of 3): basic parts</text>
<text x="40" y="84" font-size="17" fill="#55657a">Battery removed. On the board, other parts can change the reading: compare with a good board.</text>
