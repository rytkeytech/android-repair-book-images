 707.82 L454.18 716.18 M454.18 707.82 L445.82 716.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="470" y="717" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start"><tspan x="470" dy="0">0 both ways = shorted</tspan><tspan x="470" dy="18.85">OL both ways = open</tspan></text>
