<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Using a schematic to find a fault</text>
<text x="40" y="84" font-size="17" fill="#55657a">Follow the current from where it enters to where it is missing. The first wrong reading marks the fault.</text>
<rect x="40" y="125" width="160" height="100" rx="12" fill="#546E7A" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="120.0" y="180.6" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">Symptom</text><circle cx="58" cy="127" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="58" y="131.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="120.0" y="251" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="120.0" dy="0">e.g. not</tspan><tspan x="120.0" dy="19.575000000000003">charging</tspan></text><line x1="205" y1="175.0" x2="227" y2="175.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="232" y="125" width="160" height="100" rx="12" fill="#1565C0" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="312.0" y="170.68" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="312.0" dy="0">Find the</tspan><tspan x="312.0" dy="20.0">section</tspan></text><circle cx="250" cy="127" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="250" y="131.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="312.0" y="251" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="312.0" dy="0">charging</tspan><tspan x="312.0" dy="19.575000000000003">sheet</tspan></text><line x1="397" y1="175.0" x2="419" y2="175.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="424" y="125" width="160" height="100" rx="12" fill="#1565C0" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="504.0" y="170.68" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="504.0" dy="0">Follow the</tspan><tspan x="504.0" dy="20.0">net</tspan></text><circle cx="442" cy="127" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="442" y="131.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="504.0" y="251" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="504.0" dy="0">VBUS → fuse</tspan><tspan x="504.0" dy="19.575000000000003">→ OVP → IC</tspan></text><line x1="589" y1="175.0" x2="611" y2="175.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="616" y="125" width="160" height="100" rx="12" fill="#00796B" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="696.0" y="170.68" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="696.0" dy="0">Measure at</tspan><tspan x="696.0" dy="20.0">each part</tspan></text><circle cx="634" cy="127" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="634" y="131.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="696.0" y="251" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="696.0" dy="0">voltage or</tspan><tspan x="696.0" dy="19.575000000000003">diode mode</tspan></text><line x1="781" y1="175.0" x2="803" y2="175.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="808" y="125" width="160" height="100" rx="12" fill="#C62828" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="888.0" y="170.68" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="888.0" dy="0">First wrong</tspan><tspan x="888.0" dy="20.0">reading</tspan></text><circle cx="826" cy="127" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="826" y="131.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="888.0" y="251" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="888.0" dy="0">= the fault</tspan><tspan x="888.0" dy="19.575000000000003">area</tspan></text><line x1="973" y1="175.0" x2="995" y2="175.0" stroke="#546E7A" stroke-width="3" stroke-linecap="round" marker-end="url(#a546E7A)"/><rect x="1000" y="125" width="160" height="100" rx="12" fill="#2E7D32" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="1080.0" y="170.68" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="1080.0" dy="0">Locate on</tspan><tspan x="1080.0" dy="20.0">board view</tspan></text><circle cx="1018" cy="127" r="14" fill="#0D2847" stroke="#fff" stroke-width="2"/><text x="1018" y="131.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="1080.0" y="251" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="1080.0" dy="0">repair and</tspan><tspan x="1080.0" dy="19.575000000000003">re-test</tspan></text></svg>