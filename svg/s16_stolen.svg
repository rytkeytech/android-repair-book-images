<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Signs a phone may be stolen</text>
<text x="40" y="84" font-size="17" fill="#55657a">Record the customer's ID and the IMEI on the job card. Decline jobs that remove locks without proof of ownership.</text>
<rect x="40" y="120" width="208" height="230" rx="18" fill="#fff" stroke="#ffcc80" stroke-width="2" opacity="1" filter="url(#sh)"/>
<path d="M144 157.4 L175.2 212.0 L112.8 212.0 Z" fill="#f9a825" stroke="#f9a825" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="144" y="205.76" font-size="32.24" fill="#263238" font-weight="800" text-anchor="middle">!</text>
<text x="144" y="268" font-size="16" fill="#E65100" font-weight="800" text-anchor="middle"><tspan x="144" dy="0">No charger, box</tspan><tspan x="144" dy="20.8">or proof of purchase</tspan></text>
<rect x="268" y="120" width="208" height="230" rx="18" fill="#fff" stroke="#ef9a9a" stroke-width="2" opacity="1" filter="url(#sh)"/>
<path d="M372 157.4 L403.2 212.0 L340.8 212.0 Z" fill="#ef5350" stroke="#ef5350" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="372" y="205.76" font-size="32.24" fill="#263238" font-weight="800" text-anchor="middle">!</text>
<text x="372" y="268" font-size="16" fill="#C62828" font-weight="800" text-anchor="middle"><tspan x="372" dy="0">Locked to an account</tspan><tspan x="372" dy="20.8">the customer can't open</tspan></text>
<rect x="496" y="120" width="208" height="230" rx="18" fill="#fff" stroke="#ef9a9a" stroke-width="2" opacity="1" filter="url(#sh)"/>
<path d="M600 157.4 L631.2 212.0 L568.8 212.0 Z" fill="#ef5350" stroke="#ef5350" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="600" y="205.76" font-size="32.24" fill="#263238" font-weight="800" text-anchor="middle">!</text>
<text x="600" y="268" font-size="16" fill="#C62828" font-weight="800" text-anchor="middle"><tspan x="600" dy="0">Asks you to remove</tspan><tspan x="600" dy="20.8">the account lock</tspan></text>
<rect x="724" y="120" width="208" height="230" rx="18" fill="#fff" stroke="#ef9a9a" stroke-width="2" opacity="1" filter="url(#sh)"/>
<path d="M828 157.4 L859.2 212.0 L796.8 212.0 Z" fill="#ef5350" stroke="#ef5350" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="828" y="205.76" font-size="32.24" fill="#263238" font-weight="800" text-anchor="middle">!</text>
<text x="828" y="268" font-size="16" fill="#C62828" font-weight="800" text-anchor="middle"><tspan x="828" dy="0">Asks to change</tspan><tspan x="828" dy="20.8">or 'flash' the IMEI</tspan></text>
<rect x="952" y="120" width="208" height="230" rx="18" fill="#fff" stroke="#ffcc80" stroke-width="2" opacity="1" filter="url(#sh)"/>
