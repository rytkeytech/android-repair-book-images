<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Typical voltage levels on a phone board</text>
<text x="40" y="84" font-size="17" fill="#55657a">A general guide. Always confirm with the schematic for the model you are repairing.</text>
<text x="40" y="618" font-size="15" fill="#55657a">LCD bias (±5.5 V) and backlight (15–25 V) are higher, and only appear when the screen is on.</text>
