<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Reading charging current with a USB meter</text>
<text x="40" y="84" font-size="17" fill="#55657a">The meter sits between the charger and the phone and shows what is really flowing.</text>
<rect x="60" y="190" width="150" height="120" rx="16" fill="url(#dev)" stroke="#90a4ae" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="90" y="170" width="12" height="26" rx="2" fill="#90a4ae" stroke="none" stroke-width="2" opacity="1"/>
<rect x="168" y="170" width="12" height="26" rx="2" fill="#90a4ae" stroke="none" stroke-width="2" opacity="1"/>
<text x="135" y="260" font-size="16" fill="#0D2847" font-weight="700" text-anchor="middle">Charger</text>
<text x="135" y="282" font-size="14" fill="#55657a" font-weight="400" text-anchor="middle">5 V / 9 V</text>
<path d="M210 250 C260 250 270 250 320 250" fill="none" stroke="#1d1d1f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="320" y="180" width="200" height="140" rx="16" fill="url(#dark)" stroke="#263238" stroke-width="2" opacity="1" filter="url(#sh)"/>
