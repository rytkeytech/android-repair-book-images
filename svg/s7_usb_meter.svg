<text x="420" y="232" font-size="22" fill="#76ff03" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono">5.08 V</text>
<text x="420" y="266" font-size="22" fill="#ffd54f" font-weight="700" text-anchor="middle" font-family="DejaVu Sans Mono">1.62 A</text>
<text x="420" y="345" font-size="16" fill="#0D2847" font-weight="700" text-anchor="middle">USB meter</text>
<path d="M520 250 C570 250 580 250 620 250" fill="none" stroke="#1d1d1f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<g transform="translate(620,150) rotate(0) scale(1)"><rect x="0" y="0" width="110" height="210" rx="15.400000000000002" fill="#1d2630" stroke="#0b1118" stroke-width="3" opacity="1" filter="url(#sh)"/><rect x="7" y="9" width="96" height="192" rx="9.9" fill="#4fc3f7" stroke="none" stroke-width="0" opacity="1"/><circle cx="55.0" cy="18" r="3" fill="#0b1118" stroke="none" stroke-width="2"/></g>
<text x="675" y="260" font-size="34" fill="#fff" font-weight="700" text-anchor="middle">⚡</text>
<rect x="780" y="130" width="380" height="64" rx="12" fill="#ffebee" stroke="#ef9a9a" stroke-width="2" opacity="1"/>
<text x="800" y="158" font-size="17" fill="#C62828" font-weight="800" text-anchor="start">0 A</text>
<text x="800" y="180" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="start">not charging: port, cable, charging path</text>
<rect x="780" y="210" width="380" height="64" rx="12" fill="#fff3e0" stroke="#ffcc80" stroke-width="2" opacity="1"/>
<text x="800" y="238" font-size="17" fill="#E65100" font-weight="800" text-anchor="start">0.1 – 0.4 A</text>
<text x="800" y="260" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="start">weak: dirty port, poor cable, CC line</text>
<rect x="780" y="290" width="380" height="64" rx="12" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="2" opacity="1"/>
<text x="800" y="318" font-size="17" fill="#2E7D32" font-weight="800" text-anchor="start">1 – 2 A or more</text>
<text x="800" y="340" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="start">normal charging</text>
<rect x="780" y="370" width="380" height="64" rx="12" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" opacity="1"/>
<text x="800" y="398" font-size="17" fill="#1565C0" font-weight="800" text-anchor="start">falls when nearly full</text>
<text x="800" y="420" font-size="14.5" fill="#37474f" font-weight="400" text-anchor="start">normal behaviour</text></svg>