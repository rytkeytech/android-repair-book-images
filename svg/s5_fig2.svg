<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 5.2  The charging path</text>
<text x="40" y="84" font-size="17" fill="#55657a">Power from the charger passes through each part in turn. A fault anywhere stops charging.</text>
