<rect x="650" y="120" width="510" height="250" rx="18" fill="#fff" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="650" y="120" width="510" height="52" rx="18" fill="#e3f2fd" stroke="none" stroke-width="2" opacity="1"/>
<rect x="650" y="154" width="510" height="18" rx="0" fill="#e3f2fd" stroke="none" stroke-width="2" opacity="1"/>
<text x="674" y="155" font-size="19" fill="#1565C0" font-weight="800" text-anchor="start">LCD (IPS / TFT)</text>
<text x="676" y="206" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">•  Liquid crystal does not make light</text>
<text x="676" y="236" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">•  LED backlight behind the panel</text>
<text x="676" y="266" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">•  Backlight needs a boost circuit (Figure 10.2)</text>
<text x="676" y="296" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">•  No backlight: dark picture, faint under a torch</text>
<rect x="650" y="400" width="510" height="260" rx="18" fill="#fff" stroke="#ce93d8" stroke-width="2" opacity="1" filter="url(#sh)"/>
<rect x="650" y="400" width="510" height="52" rx="18" fill="#f3e5f5" stroke="none" stroke-width="2" opacity="1"/>
<rect x="650" y="434" width="510" height="18" rx="0" fill="#f3e5f5" stroke="none" stroke-width="2" opacity="1"/>
<text x="674" y="435" font-size="19" fill="#6A1B9A" font-weight="800" text-anchor="start">OLED / AMOLED</text>
<text x="676" y="490" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">•  Each pixel makes its own light</text>
<text x="676" y="522" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">•  No backlight circuit</text>
<text x="676" y="554" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">•  Needs ELVDD and ELVSS rails</text>
<text x="676" y="586" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">•  Damage: black spots, green or pink lines</text>
<text x="676" y="618" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">•  Usually replaced as a complete unit</text></svg>