<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1a2b" flood-opacity=".25"/></filter>
<marker id="a0D2847" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0D2847"/></marker><marker id="aE65100" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E65100"/></marker><marker id="a1565C0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1565C0"/></marker><marker id="a2E7D32" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aC62828" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C62828"/></marker><marker id="a6A1B9A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6A1B9A"/></marker><marker id="a00796B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00796B"/></marker><marker id="a546E7A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#546E7A"/></marker><marker id="a1d1d1f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f"/></marker><marker id="aff5722" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5722"/></marker><marker id="affffff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="720" fill="#fff"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Voltage, current and resistance: the water pipe idea</text>
<text x="40" y="84" font-size="17" fill="#55657a">Electricity behaves like water in pipes. Learn this picture and Ohm's law makes sense.</text>
<rect x="60" y="130" width="150" height="260" rx="14" fill="#eceff1" stroke="#90a4ae" stroke-width="3" opacity="1"/>
<rect x="66" y="190" width="138" height="194" rx="8" fill="url(#water)" stroke="none" stroke-width="2" opacity="1"/>
<path d="M66 190 q35 -10 69 0 t69 0" fill="none" stroke="#bbdefb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="135" y="125" font-size="1" fill="#1d1d1f" font-weight="400" text-anchor="start"></text>
<rect x="55" y="400" width="160" height="66" rx="12" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" opacity="1"/><text x="135.0" y="428.6" font-size="16" fill="#1565C0" font-weight="700" text-anchor="middle">Tank height</text><text x="135.0" y="449.40000000000003" font-size="13.5" fill="#37474f" font-weight="400" text-anchor="middle">= VOLTAGE (V)</text>
<rect x="204" y="300" width="240" height="56" rx="6" fill="url(#water)" stroke="#1565c0" stroke-width="2" opacity="1"/>
<rect x="444" y="316" width="180" height="24" rx="4" fill="url(#water)" stroke="#1565c0" stroke-width="2" opacity="1"/>
<rect x="624" y="300" width="240" height="56" rx="6" fill="url(#water)" stroke="#1565c0" stroke-width="2" opacity="1"/>
<line x1="230" y1="328" x2="276" y2="328" stroke="#ffffff" stroke-width="3" stroke-linecap="round" marker-end="url(#affffff)"/>
<line x1="300" y1="328" x2="346" y2="328" stroke="#ffffff" stroke-width="3" stroke-linecap="round" marker-end="url(#affffff)"/>
<line x1="370" y1="328" x2="416" y2="328" stroke="#ffffff" stroke-width="3" stroke-linecap="round" marker-end="url(#affffff)"/>
<line x1="650" y1="328" x2="696" y2="328" stroke="#ffffff" stroke-width="3" stroke-linecap="round" marker-end="url(#affffff)"/>
<line x1="720" y1="328" x2="766" y2="328" stroke="#ffffff" stroke-width="3" stroke-linecap="round" marker-end="url(#affffff)"/>
<line x1="790" y1="328" x2="836" y2="328" stroke="#ffffff" stroke-width="3" stroke-linecap="round" marker-end="url(#affffff)"/>
<line x1="460" y1="328" x2="600" y2="328" stroke="#ffffff" stroke-width="2" stroke-linecap="round" marker-end="url(#affffff)"/>
<rect x="234" y="196" width="180" height="66" rx="12" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" opacity="1"/><text x="324.0" y="224.6" font-size="16" fill="#1565C0" font-weight="700" text-anchor="middle">Flow of water</text><text x="324.0" y="245.4" font-size="13.5" fill="#37474f" font-weight="400" text-anchor="middle">= CURRENT (A)</text>
<rect x="444" y="196" width="180" height="66" rx="12" fill="#fff3e0" stroke="#ffcc80" stroke-width="2" opacity="1"/><text x="534.0" y="224.6" font-size="16" fill="#E65100" font-weight="700" text-anchor="middle">Narrow pipe</text><text x="534.0" y="245.4" font-size="13.5" fill="#37474f" font-weight="400" text-anchor="middle">= RESISTANCE (Ω)</text>
<line x1="534" y1="262" x2="534" y2="312" stroke="#E65100" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
<circle cx="905" cy="328" r="42" fill="#fff" stroke="#1565c0" stroke-width="4"/>
<path d="M905 286 V370 M863 328 H947 M875 298 L935 358 M935 298 L875 358" fill="none" stroke="#1565c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="905" y="400" font-size="14" fill="#55657a" font-weight="400" text-anchor="middle">does work</text>
<text x="60" y="520" font-size="17" fill="#0D2847" font-weight="700" text-anchor="start">The same idea as a circuit:</text>
<path d="M110 598 L110 560 L440 560" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="440" y="551" width="80" height="18" rx="2" fill="#fff" stroke="#E65100" stroke-width="2" opacity="1"/>
<path d="M520 560 L840 560 L840 650 L110 650 L110 612" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<line x1="86" y1="598" x2="134" y2="598" stroke="#1d1d1f" stroke-width="4" stroke-linecap="round"/>
<line x1="98" y1="612" x2="122" y2="612" stroke="#1d1d1f" stroke-width="4" stroke-linecap="round"/>
<text x="146" y="610" font-size="15" fill="#1565C0" font-weight="600" text-anchor="start">battery = voltage</text>
<text x="480" y="542" font-size="15" fill="#E65100" font-weight="600" text-anchor="middle">resistor = resistance</text>
<line x1="640" y1="548" x2="760" y2="548" stroke="#1565C0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a1565C0)"/>
<text x="700" y="538" font-size="14" fill="#1565C0" font-weight="600" text-anchor="middle">current</text>
<rect x="870" y="108" width="300" height="120" rx="12" fill="#e3f2fd" stroke="none" stroke-width="2" opacity="1"/><rect x="870" y="108" width="6" height="120" rx="3" fill="#1565C0" stroke="none" stroke-width="2" opacity="1"/><circle cx="904" cy="168.0" r="15" fill="#1565C0" stroke="none" stroke-width="2"/><text x="904" y="174.0" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">i</text><text x="932" y="151.72500000000002" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start"><tspan x="932" dy="0">More voltage pushes more</tspan><tspan x="932" dy="21.7">current. More resistance</tspan><tspan x="932" dy="21.7">allows less current.</tspan></text>
<rect x="880" y="470" width="280" height="120" rx="16" fill="#0D2847" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/>
<text x="1020" y="520" font-size="34" fill="#fff" font-weight="800" text-anchor="middle">V = I × R</text>
<text x="1020" y="560" font-size="16" fill="#c5cfe0" font-weight="400" text-anchor="middle">Ohm's law</text></svg>