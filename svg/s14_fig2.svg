<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 14.2  Repairing a broken track with a jumper wire</text>
<rect x="40" y="100" width="1120" height="340" rx="12" fill="url(#pcb)" stroke="#123d22" stroke-width="2" opacity="1" filter="url(#sh)"/>
<path d="M120 300 L480 300" fill="none" stroke="#d4af37" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<path d="M640 300 L1080 300" fill="none" stroke="#d4af37" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="470" y="286" width="180" height="28" rx="0" fill="#1b5631" stroke="none" stroke-width="2" opacity="1"/>
<path d="M480 300 l14 -10 l16 18 l18 -16 l18 14" fill="none" stroke="#d4af37" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<circle cx="560" cy="300" r="60" fill="none" stroke="#ff7043" stroke-width="3"/>
<text x="560" y="400" font-size="15" fill="#ffccbc" font-weight="700" text-anchor="middle"><tspan x="560" dy="0">broken track</tspan><tspan x="560" dy="20.25">(corrosion or a scratch)</tspan></text>
<rect x="180" y="284" width="70" height="32" rx="3" fill="#8d6e4a" stroke="#4e342e" stroke-width="2" opacity="1"/>
<rect x="180" y="284" width="16" height="32" rx="2" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/>
<rect x="234" y="284" width="16" height="32" rx="2" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/>
<text x="215" y="270" font-size="16" fill="#fff" font-weight="800" text-anchor="middle">C1</text>
<rect x="940" y="284" width="70" height="32" rx="3" fill="#212121" stroke="none" stroke-width="2" opacity="1"/>
<rect x="940" y="284" width="16" height="32" rx="2" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/>
<rect x="994" y="284" width="16" height="32" rx="2" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/>
<text x="975" y="270" font-size="16" fill="#fff" font-weight="800" text-anchor="middle">R7</text>
<path d="M242 300 C400 140 800 140 948 300" fill="none" stroke="#ffb300" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<circle cx="242" cy="300" r="9" fill="#cfd8dc" stroke="#78909c" stroke-width="2"/>
<circle cx="948" cy="300" r="9" fill="#cfd8dc" stroke="#78909c" stroke-width="2"/>
<text x="595" y="172" font-size="18" fill="#ffe082" font-weight="800" text-anchor="middle">enamelled copper jumper wire</text>
<text x="150" y="200" font-size="14" fill="#e8f5e9" font-weight="700" text-anchor="middle"><tspan x="150" dy="0">solder to the nearest</tspan><tspan x="150" dy="18.900000000000002">pad on the same net</tspan></text>
<circle cx="60" cy="486" r="15" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="60" y="491.04" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="88" y="492" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">Find the break: continuity mode from point to point along the line, using the schematic or board view.</text>
<circle cx="60" cy="534" r="15" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="60" y="539.04" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="88" y="540" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">Choose the two nearest good points on the same net (component pads or test points), not the damaged track itself.</text>
<circle cx="60" cy="582" r="15" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="60" y="587.04" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="88" y="588" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">Cut a thin enamelled wire to length. Scrape or burn off the enamel only at the ends, and tin the ends with solder.</text>
<circle cx="60" cy="630" r="15" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="60" y="635.04" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<text x="88" y="636" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">Solder each end with flux and a fine tip. Check continuity end to end, and that there is no short to nearby parts.</text>
<circle cx="60" cy="678" r="15" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="60" y="683.04" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">5</text>
<text x="88" y="684" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">Fix the wire in place with UV solder mask or glue so it cannot move or break when the phone is reassembled.</text></svg>