<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, DejaVu Sans, sans-serif"><defs>
<linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7d46"/><stop offset="1" stop-color="#1b5631"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa4ad"/><stop offset=".5" stop-color="#eef1f3"/><stop offset="1" stop-color="#8a949d"/></linearGradient>
<linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f5f7"/><stop offset="1" stop-color="#aab3bb"/></linearGradient>
<linearGradient id="dev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset="1" stop-color="#b8c3cb"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5d68"/><stop offset="1" stop-color="#263238"/></linearGradient>
<linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd54f"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4a5c"/><stop offset=".5" stop-color="#121a24"/><stop offset="1" stop-color="#05080c"/></linearGradient>
<linearGradient id="batt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b4652"/><stop offset="1" stop-color="#1f262e"/></linearGradient>
<linearGradient id="copper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c06a"/><stop offset="1" stop-color="#b8892e"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64b5f6"/><stop offset="1" stop-color="#1e88e5"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1a2b" flood-opacity=".18"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1a2b" flood-opacity=".25"/></filter>
<marker id="a0D2847" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0D2847"/></marker><marker id="aE65100" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E65100"/></marker><marker id="a1565C0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1565C0"/></marker><marker id="a2E7D32" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aC62828" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C62828"/></marker><marker id="a6A1B9A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6A1B9A"/></marker><marker id="a00796B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00796B"/></marker><marker id="a546E7A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#546E7A"/></marker><marker id="a1d1d1f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f"/></marker><marker id="aff5722" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5722"/></marker><marker id="affffff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="760" fill="#fff"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 9.1  The charging path and where to measure</text>
<text x="40" y="84" font-size="17" fill="#55657a">Follow the numbers from the port to the battery. The first missing voltage is your fault area.</text>
<rect x="50" y="160" width="130" height="90" rx="12" fill="#546e7a" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="115.0" y="200.95" font-size="15" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="115.0" dy="0">Charging</tspan><tspan x="115.0" dy="18.75">port</tspan></text>
<rect x="230" y="160" width="100" height="90" rx="12" fill="#6d4c41" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="280.0" y="210.25" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">Fuse</text>
<rect x="390" y="160" width="130" height="90" rx="12" fill="#455a64" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="455.0" y="200.95" font-size="15" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="455.0" dy="0">OVP</tspan><tspan x="455.0" dy="18.75">(protection)</tspan></text>
<rect x="590" y="140" width="170" height="130" rx="12" fill="#0D2847" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="675.0" y="200.95" font-size="15" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="675.0" dy="0">Charging IC</tspan><tspan x="675.0" dy="18.75">(or PMIC)</tspan></text>
<rect x="830" y="160" width="100" height="90" rx="12" fill="#6d4c41" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="880.0" y="210.25" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">Coil</text>
<rect x="990" y="160" width="130" height="90" rx="12" fill="#37474f" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/><text x="1055.0" y="200.95" font-size="15" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="1055.0" dy="0">Battery</tspan><tspan x="1055.0" dy="18.75">connector</tspan></text>
<line x1="180" y1="205" x2="230" y2="205" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
<line x1="330" y1="205" x2="390" y2="205" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
<line x1="520" y1="205" x2="590" y2="205" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
<line x1="760" y1="205" x2="830" y2="205" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
<line x1="930" y1="205" x2="990" y2="205" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
<text x="205" y="194" font-size="12" fill="#C62828" font-weight="800" text-anchor="middle">VBUS</text>
<text x="555" y="194" font-size="12" fill="#C62828" font-weight="800" text-anchor="middle">VCHG</text>
<text x="960" y="194" font-size="12" fill="#C62828" font-weight="800" text-anchor="middle">VBAT</text>
<path d="M115 250 L115 330 L680 330 L680 270" fill="none" stroke="#1565C0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="400" y="320" font-size="14" fill="#1565C0" font-weight="700" text-anchor="middle">D+ / D–  (charger handshake, fast charge)</text>
<path d="M95 250 L95 370 L715 370 L715 270" fill="none" stroke="#6A1B9A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="400" y="362" font-size="14" fill="#6A1B9A" font-weight="700" text-anchor="middle">CC1 / CC2  (USB-C only: detects cable and charger)</text>
<path d="M1055 250 L1055 400 L750 400 L750 270" fill="none" stroke="#2E7D32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="900" y="424" font-size="14" fill="#2E7D32" font-weight="700" text-anchor="middle">NTC / BAT_ID (battery temperature and type)</text>
<circle cx="205" cy="230" r="16" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="205" y="235.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<circle cx="360" cy="230" r="16" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="360" y="235.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<circle cx="555" cy="230" r="16" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="555" y="235.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<circle cx="960" cy="230" r="16" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="960" y="235.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<circle cx="115" cy="290" r="16" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="115" y="295.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">5</text>
<circle cx="1055" cy="330" r="16" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="1055" y="335.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">6</text>
<circle cx="64" cy="470" r="14" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="64" y="474.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="92" y="476" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">VBUS at the port: about 5 V with a charger (9 V or more with some fast chargers).</text>
<circle cx="64" cy="514" r="14" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="64" y="518.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="92" y="520" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">After the fuse: same as 1. If 0 V, the fuse is open: check VBUS for a short first.</text>
<circle cx="64" cy="558" r="14" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="64" y="562.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="92" y="564" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">After the OVP: same as 1. If 5 V goes in but nothing comes out, the OVP is faulty or blocking a fault.</text>
<circle cx="64" cy="602" r="14" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="64" y="606.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<text x="92" y="608" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">VBAT should rise slowly while charging. Check the coil if the charging IC has output but VBAT does not.</text>
<circle cx="64" cy="646" r="14" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="64" y="650.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text>
<text x="92" y="652" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">Data and CC lines: diode-mode readings compared with a good board. A short here can stop charging.</text>
<circle cx="64" cy="690" r="14" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="64" y="694.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text>
<text x="92" y="696" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">NTC line: missing or damaged makes the phone think the battery is too hot or too cold.</text></svg>