<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">How to test components (3 of 3): other parts</text>
<text x="40" y="84" font-size="17" fill="#55657a">Check the simple parts first. They fail more often than chips.</text>
<rect x="40" y="110" width="360" height="316" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/><rect x="40" y="110" width="360" height="112" rx="18" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><rect x="40" y="204" width="360" height="18" rx="0" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><g transform="translate(220,168) rotate(0) scale(1)"><circle cx="0" cy="0" r="32" fill="url(#metal)" stroke="#78909c" stroke-width="2"/><circle cx="0" cy="0" r="12" fill="#90a4ae" stroke="none" stroke-width="2"/><line x1="22" y1="22" x2="40" y2="36" stroke="#C62828" stroke-width="3" stroke-linecap="round"/><line x1="14" y1="28" x2="30" y2="42" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/></g><text x="60" y="252" font-size="19" fill="#0D2847" font-weight="800" text-anchor="start">Vibration motor</text><rect x="276" y="232" width="108" height="28" rx="14" fill="#e8f5e9" stroke="none" stroke-width="2" opacity="1"/><text x="330" y="251" font-size="13.5" fill="#2E7D32" font-weight="800" text-anchor="middle">Ω mode / PSU</text><text x="60" y="284" font-size="14" fill="#37474f" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Probes on both pads, or</tspan><tspan x="60" dy="18.2">2–3 V from the PSU.</tspan></text><circle cx="70" cy="337" r="11" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M65.05 337 L68.9 341.18 L75.5 333.15" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="90" y="342" font-size="14.5" fill="#2E7D32" font-weight="700" text-anchor="start">10–40 Ω, spins on 3 V</text><circle cx="70" cy="376" r="11" fill="#C62828" stroke="none" stroke-width="2"/><path d="M65.82 371.82 L74.18 380.18 M74.18 371.82 L65.82 380.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="90" y="381" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start">OL = open · no spin = bad</text>
<rect x="420" y="110" width="360" height="316" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/><rect x="420" y="110" width="360" height="112" rx="18" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><rect x="420" y="204" width="360" height="18" rx="0" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><g transform="translate(600,168) rotate(0) scale(1)"><rect x="-50" y="-18" width="100" height="36" rx="8" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2" opacity="1"/><rect x="-20" y="-28" width="40" height="14" rx="5" fill="url(#metal)" stroke="#78909c" stroke-width="1.5" opacity="1"/><line x1="-50" y1="0" x2="-66" y2="0" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="0" x2="66" y2="0" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/></g><text x="440" y="252" font-size="19" fill="#0D2847" font-weight="800" text-anchor="start">Power / volume key</text><rect x="656" y="232" width="108" height="28" rx="14" fill="#f3e5f5" stroke="none" stroke-width="2" opacity="1"/><text x="710" y="251" font-size="13.5" fill="#6A1B9A" font-weight="800" text-anchor="middle">Continuity</text><text x="440" y="284" font-size="14" fill="#37474f" font-weight="400" text-anchor="start">Probes across the key.</text><circle cx="450" cy="323" r="11" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M445.05 323 L448.9 327.18 L455.5 319.15" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="470" y="328" font-size="14.5" fill="#2E7D32" font-weight="700" text-anchor="start">Beeps only when pressed</text><circle cx="450" cy="362" r="11" fill="#C62828" stroke="none" stroke-width="2"/><path d="M445.82 357.82 L454.18 366.18 M454.18 357.82 L445.82 366.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="470" y="367" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start"><tspan x="470" dy="0">Always beeps = stuck</tspan><tspan x="470" dy="18.85">Never beeps = broken</tspan></text>
<rect x="800" y="110" width="360" height="316" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/><rect x="800" y="110" width="360" height="112" rx="18" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><rect x="800" y="204" width="360" height="18" rx="0" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><g transform="translate(980,168) rotate(0) scale(1)"><rect x="-30" y="-11" width="60" height="22" rx="2" fill="#8d6e4a" stroke="#4e342e" stroke-width="1" opacity="1"/><rect x="-30" y="-11" width="13.2" height="22" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="16.800000000000004" y="-11" width="13.2" height="22" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><text x="0" y="34" font-size="11" fill="#55657a" font-weight="700" text-anchor="middle">NTC (BTEMP)</text></g><text x="820" y="252" font-size="19" fill="#0D2847" font-weight="800" text-anchor="start">NTC thermistor</text><rect x="1036" y="232" width="108" height="28" rx="14" fill="#e8f5e9" stroke="none" stroke-width="2" opacity="1"/><text x="1090" y="251" font-size="13.5" fill="#2E7D32" font-weight="800" text-anchor="middle">Ω mode</text><text x="820" y="284" font-size="14" fill="#37474f" font-weight="400" text-anchor="start">Probes on both ends.</text><circle cx="830" cy="323" r="11" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M825.05 323 L828.9 327.18 L835.5 319.15" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="850" y="328" font-size="14.5" fill="#2E7D32" font-weight="700" text-anchor="start">About 10 kΩ at room temp</text><circle cx="830" cy="362" r="11" fill="#C62828" stroke="none" stroke-width="2"/><path d="M825.82 357.82 L834.18 366.18 M834.18 357.82 L825.82 366.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="850" y="367" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start"><tspan x="850" dy="0">0 or OL = faulty</tspan><tspan x="850" dy="18.85">(value drops when warm)</tspan></text>
<rect x="40" y="446" width="360" height="316" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/><rect x="40" y="446" width="360" height="112" rx="18" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><rect x="40" y="540" width="360" height="18" rx="0" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><g transform="translate(220,504) rotate(0) scale(1)"><rect x="-60" y="-26" width="120" height="52" rx="8" fill="url(#batt)" stroke="#0d1115" stroke-width="2" opacity="1"/><rect x="-46" y="-16" width="64" height="32" rx="4" fill="#E65100" stroke="none" stroke-width="2" opacity="1"/><rect x="60" y="-10" width="8" height="20" rx="2" fill="#37474f" stroke="none" stroke-width="2" opacity="1"/></g><text x="60" y="588" font-size="19" fill="#0D2847" font-weight="800" text-anchor="start">Battery</text><rect x="276" y="568" width="108" height="28" rx="14" fill="#e3f2fd" stroke="none" stroke-width="2" opacity="1"/><text x="330" y="587" font-size="13.5" fill="#1565C0" font-weight="800" text-anchor="middle">DC volts</text><text x="60" y="620" font-size="14" fill="#37474f" font-weight="400" text-anchor="start">Red on +, black on –.</text><circle cx="70" cy="659" r="11" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M65.05 659 L68.9 663.18 L75.5 655.15" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="90" y="664" font-size="14.5" fill="#2E7D32" font-weight="700" text-anchor="start">3.7–4.4 V</text><circle cx="70" cy="698" r="11" fill="#C62828" stroke="none" stroke-width="2"/><path d="M65.82 693.82 L74.18 702.18 M74.18 693.82 L65.82 702.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="90" y="703" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start"><tspan x="90" dy="0">Below 3.0 V = very flat</tspan><tspan x="90" dy="18.85">Swollen = replace</tspan></text>
<rect x="420" y="446" width="360" height="316" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/><rect x="420" y="446" width="360" height="112" rx="18" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><rect x="420" y="540" width="360" height="18" rx="0" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><g transform="translate(600,504) rotate(0) scale(1)"><rect x="-70" y="-14" width="140" height="28" rx="4" fill="#ff9800" stroke="#e65100" stroke-width="1.5" opacity="0.85"/><rect x="40" y="-18" width="34" height="36" rx="3" fill="#263238" stroke="none" stroke-width="2" opacity="1"/><rect x="44" y="-12" width="4" height="24" rx="1" fill="#d4af37" stroke="none" stroke-width="2" opacity="1"/><rect x="51" y="-12" width="4" height="24" rx="1" fill="#d4af37" stroke="none" stroke-width="2" opacity="1"/><rect x="58" y="-12" width="4" height="24" rx="1" fill="#d4af37" stroke="none" stroke-width="2" opacity="1"/><rect x="65" y="-12" width="4" height="24" rx="1" fill="#d4af37" stroke="none" stroke-width="2" opacity="1"/></g><text x="440" y="588" font-size="19" fill="#0D2847" font-weight="800" text-anchor="start">Flex / connector</text><rect x="656" y="568" width="108" height="28" rx="14" fill="#f3e5f5" stroke="none" stroke-width="2" opacity="1"/><text x="710" y="587" font-size="13.5" fill="#6A1B9A" font-weight="800" text-anchor="middle">Continuity</text><text x="440" y="620" font-size="14" fill="#37474f" font-weight="400" text-anchor="start"><tspan x="440" dy="0">Pin to pin, end to end.</tspan><tspan x="440" dy="18.2">Look at every pin.</tspan></text><circle cx="450" cy="673" r="11" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M445.05 673 L448.9 677.18 L455.5 669.15" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="470" y="678" font-size="14.5" fill="#2E7D32" font-weight="700" text-anchor="start">Every line beeps</text><circle cx="450" cy="712" r="11" fill="#C62828" stroke="none" stroke-width="2"/><path d="M445.82 707.82 L454.18 716.18 M454.18 707.82 L445.82 716.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="470" y="717" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start"><tspan x="470" dy="0">No beep = broken line</tspan><tspan x="470" dy="18.85">Bent or burnt pin = replace</tspan></text>
<rect x="800" y="446" width="360" height="316" rx="18" fill="#fff" stroke="#dfe5ec" stroke-width="2" opacity="1" filter="url(#sh)"/><rect x="800" y="446" width="360" height="112" rx="18" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><rect x="800" y="540" width="360" height="18" rx="0" fill="#f5f7fa" stroke="none" stroke-width="2" opacity="1"/><g transform="translate(980,504) rotate(0) scale(1)"><rect x="-40" y="-26" width="80" height="52" rx="4" fill="#263238" stroke="#111" stroke-width="1.5" opacity="1"/><rect x="-35.0" y="-32" width="6" height="6" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="-35.0" y="26" width="6" height="6" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="-19.0" y="-32" width="6" height="6" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="-19.0" y="26" width="6" height="6" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="-3.0" y="-32" width="6" height="6" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="-3.0" y="26" width="6" height="6" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="13.0" y="-32" width="6" height="6" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="13.0" y="26" width="6" height="6" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="29.0" y="-32" width="6" height="6" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><rect x="29.0" y="26" width="6" height="6" rx="1" fill="#cfd8dc" stroke="none" stroke-width="2" opacity="1"/><circle cx="-31" cy="-17" r="3" fill="#455a64" stroke="none" stroke-width="2"/><text x="0.0" y="5.04" font-size="14" fill="#cfd8dc" font-weight="700" text-anchor="middle">IC</text></g><text x="820" y="588" font-size="19" fill="#0D2847" font-weight="800" text-anchor="start">IC (chip)</text><rect x="1036" y="568" width="108" height="28" rx="14" fill="#e3f2fd" stroke="none" stroke-width="2" opacity="1"/><text x="1090" y="587" font-size="13.5" fill="#1565C0" font-weight="800" text-anchor="middle">Volts + diode</text><text x="820" y="620" font-size="14" fill="#37474f" font-weight="400" text-anchor="start"><tspan x="820" dy="0">You cannot test it alone.</tspan><tspan x="820" dy="18.2">Check around it.</tspan></text><circle cx="830" cy="673" r="11" fill="#2E7D32" stroke="none" stroke-width="2"/><path d="M825.05 673 L828.9 677.18 L835.5 669.15" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="850" y="678" font-size="14.5" fill="#2E7D32" font-weight="700" text-anchor="start">Power, clock, enable OK</text><circle cx="830" cy="712" r="11" fill="#C62828" stroke="none" stroke-width="2"/><path d="M825.82 707.82 L834.18 716.18 M834.18 707.82 L825.82 716.18" fill="none" stroke="#fff" stroke-width="2.42" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="850" y="717" font-size="14.5" fill="#C62828" font-weight="700" text-anchor="start"><tspan x="850" dy="0">All OK but no output =</tspan><tspan x="850" dy="18.85">suspect the chip (Ch. 15)</tspan></text></svg>