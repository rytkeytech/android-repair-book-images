<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">What diode-mode readings mean on a phone board</text>
<text x="40" y="84" font-size="17" fill="#55657a">Red probe on ground, black probe on the line. Compare with the same point on a good board.</text>
<text x="40" y="538" font-size="15" fill="#55657a">Exact values differ by model. The pattern is what matters: near zero is a short, OL is open.</text>
<rect x="60" y="200" width="151.20000000000002" height="70" rx="0" fill="#C62828" stroke="#fff" stroke-width="2" opacity="1"/><text x="135.60000000000002" y="241.0" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">0.000–0.050</text><text x="135.60000000000002" y="296" font-size="13.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="135.60000000000002" dy="0">SHORT</tspan><tspan x="135.60000000000002" dy="17.55">to ground</tspan></text><rect x="211.20000000000002" y="200" width="151.20000000000002" height="70" rx="0" fill="#f9a825" stroke="#fff" stroke-width="2" opacity="1"/><text x="286.8" y="241.0" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">0.05–0.25</text><text x="286.8" y="296" font-size="13.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="286.8" dy="0">Low: suspect,</tspan><tspan x="286.8" dy="17.55">compare</tspan></text><rect x="362.40000000000003" y="200" width="388.8" height="70" rx="0" fill="#2E7D32" stroke="#fff" stroke-width="2" opacity="1"/><text x="556.8000000000001" y="241.0" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">0.25 – 0.90</text><text x="556.8000000000001" y="296" font-size="13.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="556.8000000000001" dy="0">Normal for most power</tspan><tspan x="556.8000000000001" dy="17.55">and signal lines</tspan></text><rect x="751.2" y="200" width="216.0" height="70" rx="0" fill="#42a5f5" stroke="#fff" stroke-width="2" opacity="1"/><text x="859.2" y="241.0" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">0.90 – 1.3</text><text x="859.2" y="296" font-size="13.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="859.2" dy="0">Higher: normal</tspan><tspan x="859.2" dy="17.55">for data lines</tspan></text><rect x="967.2" y="200" width="172.8" height="70" rx="0" fill="#78909c" stroke="#fff" stroke-width="2" opacity="1"/><text x="1053.6000000000001" y="241.0" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">OL</text><text x="1053.6000000000001" y="296" font-size="13.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="1053.6000000000001" dy="0">Open: broken</tspan><tspan x="1053.6000000000001" dy="17.55">or not connected</tspan></text>
<line x1="60" y1="180" x2="60" y2="200" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="172" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="middle">0.00</text>
<line x1="211" y1="180" x2="211" y2="200" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/>
<text x="211" y="172" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="middle">0.05</text>
<line x1="362" y1="180" x2="362" y2="200" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/>
<text x="362" y="172" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="middle">0.25</text>
<line x1="751" y1="180" x2="751" y2="200" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/>
<text x="751" y="172" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="middle">0.90</text>
<line x1="967" y1="180" x2="967" y2="200" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/>
<text x="967" y="172" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="middle">1.30</text>
<rect x="60" y="380" width="1080" height="84" rx="12" fill="#ffebee" stroke="none" stroke-width="2" opacity="1"/><rect x="60" y="380" width="6" height="84" rx="3" fill="#C62828" stroke="none" stroke-width="2" opacity="1"/><circle cx="94" cy="422.0" r="15" fill="#C62828" stroke="none" stroke-width="2"/><text x="94" y="428.0" font-size="17" fill="#fff" font-weight="800" text-anchor="middle">!</text><text x="122" y="416.40000000000003" font-size="16" fill="#263238" font-weight="400" text-anchor="start"><tspan x="122" dy="0">A reading of 0.000 on VBAT or VPH_PWR means a short. Current from the battery or power</tspan><tspan x="122" dy="22.4">supply will rush into it and the faulty part will heat up.</tspan></text></svg>