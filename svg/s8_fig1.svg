<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="1200" height="1060" font-family="Inter, DejaVu Sans, sans-serif"><defs>
<linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7d46"/><stop offset="1" stop-color="#1b5631"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa4ad"/><stop offset=".5" stop-color="#eef1f3"/><stop offset="1" stop-color="#8a949d"/></linearGradient>
<linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f5f7"/><stop offset="1" stop-color="#aab3bb"/></linearGradient>
<linearGradient id="dev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset="1" stop-color="#b8c3cb"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5d68"/><stop offset="1" stop-color="#263238"/></linearGradient>
<linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd54f"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4a5c"/><stop offset=".5" stop-color="#121a24"/><stop offset="1" stop-color="#05080c"/></linearGradient>
<linearGradient id="batt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b4652"/><stop offset="1" stop-color="#1f262e"/></linearGradient>
<linearGradient id="copper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c06a"/><stop offset="1" stop-color="#b8892e"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64b5f6"/><stop offset="1" stop-color="#1e88e5"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1a2b" flood-opacity=".18"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1a2b" flood-opacity=".25"/></filter>
<marker id="a0D2847" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0D2847"/></marker><marker id="aE65100" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E65100"/></marker><marker id="a1565C0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1565C0"/></marker><marker id="a2E7D32" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aC62828" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C62828"/></marker><marker id="a6A1B9A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6A1B9A"/></marker><marker id="a00796B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00796B"/></marker><marker id="a546E7A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#546E7A"/></marker><marker id="a1d1d1f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f"/></marker><marker id="aff5722" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5722"/></marker><marker id="affffff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="1060" fill="#fff"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 8.1  No-power diagnosis flowchart</text>
<text x="40" y="84" font-size="17" fill="#55657a">Always do the cheap, simple checks first. Most 'dead' phones have a flat battery, a dirty port or a stuck power key.</text>
<rect x="360" y="110" width="480" height="66" rx="14" fill="#eceff1" stroke="#cfd8dc" stroke-width="2" opacity="1" filter="url(#sh)"/><text x="600.0" y="140.0" font-size="16" fill="#1a2a3a" font-weight="600" text-anchor="middle"><tspan x="600.0" dy="0">Customer: 'the phone is dead'</tspan><tspan x="600.0" dy="20.8">Ask: water? drop? earlier repair? charging?</tspan></text>
<line x1="600" y1="178" x2="600" y2="200" stroke="#0D2847" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0D2847)"/>
<rect x="360" y="204" width="480" height="66" rx="14" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/><text x="600.0" y="234.0" font-size="16" fill="#1a2a3a" font-weight="600" text-anchor="middle"><tspan x="600.0" dy="0">1. Quick checks: charge 30 min, try a good battery,</tspan><tspan x="600.0" dy="20.8">force restart, check power key and port</tspan></text>
<line x1="600" y1="272" x2="600" y2="292" stroke="#0D2847" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0D2847)"/>
<path d="M600 294.0 L750.0 340 L600 386.0 L450.0 340 Z" fill="#fff3e0" stroke="#E65100" stroke-width="2.5" filter="url(#sh)"/><text x="600" y="337" font-size="15.5" fill="#4e2a00" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">Does it power</tspan><tspan x="600" dy="20.150000000000002">on now?</tspan></text>
<line x1="752" y1="340" x2="860" y2="340" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2E7D32)"/>
<text x="806" y="330" font-size="14" fill="#2E7D32" font-weight="800" text-anchor="middle">YES</text>
<rect x="864" y="304" width="280" height="72" rx="14" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="2" opacity="1" filter="url(#sh)"/><text x="1004.0" y="337.0" font-size="16" fill="#1a2a3a" font-weight="600" text-anchor="middle"><tspan x="1004.0" dy="0">Battery, port or key fault.</tspan><tspan x="1004.0" dy="20.8">Repair and test.</tspan></text>
<line x1="600" y1="388" x2="600" y2="420" stroke="#C62828" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aC62828)"/>
<text x="616" y="410" font-size="14" fill="#C62828" font-weight="800" text-anchor="start">NO</text>
<rect x="360" y="424" width="480" height="66" rx="14" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/><text x="600.0" y="454.0" font-size="16" fill="#1a2a3a" font-weight="600" text-anchor="middle"><tspan x="600.0" dy="0">2. Open the phone. Check under the microscope for</tspan><tspan x="600.0" dy="20.8">corrosion, burnt or missing parts, bent shields</tspan></text>
<line x1="600" y1="492" x2="600" y2="512" stroke="#0D2847" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0D2847)"/>
<rect x="360" y="516" width="480" height="66" rx="14" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/><text x="600.0" y="546.0" font-size="16" fill="#1a2a3a" font-weight="600" text-anchor="middle"><tspan x="600.0" dy="0">3. Connect the DC power supply (4.0 V, 1 A limit).</tspan><tspan x="600.0" dy="20.8">Read the current BEFORE pressing power.</tspan></text>
<line x1="600" y1="584" x2="600" y2="604" stroke="#0D2847" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0D2847)"/>
<path d="M600 606.0 L760.0 652 L600 698.0 L440.0 652 Z" fill="#fff3e0" stroke="#E65100" stroke-width="2.5" filter="url(#sh)"/><text x="600" y="649" font-size="15.5" fill="#4e2a00" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">Current before</tspan><tspan x="600" dy="20.150000000000002">pressing power?</tspan></text>
<line x1="762" y1="652" x2="860" y2="652" stroke="#C62828" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aC62828)"/>
<text x="810" y="642" font-size="14" fill="#C62828" font-weight="800" text-anchor="middle">HIGH</text>
<rect x="864" y="616" width="280" height="72" rx="14" fill="#ffebee" stroke="#ef9a9a" stroke-width="2" opacity="1" filter="url(#sh)"/><text x="1004.0" y="649.0" font-size="16" fill="#1a2a3a" font-weight="600" text-anchor="middle"><tspan x="1004.0" dy="0">Short on VBAT. Find it with</tspan><tspan x="1004.0" dy="20.8">voltage injection (Chapter 6).</tspan></text>
<line x1="600" y1="700" x2="600" y2="732" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2E7D32)"/>
<text x="616" y="722" font-size="14" fill="#2E7D32" font-weight="800" text-anchor="start">0 mA</text>
<rect x="360" y="736" width="480" height="60" rx="14" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/><text x="600.0" y="772.0" font-size="16" fill="#1a2a3a" font-weight="600" text-anchor="middle">4. Press power and read the pattern (Figure 7.3)</text>
<line x1="600" y1="798" x2="600" y2="816" stroke="#0D2847" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0D2847)"/>
<path d="M600 816.0 L750.0 856 L600 896.0 L450.0 856 Z" fill="#fff3e0" stroke="#E65100" stroke-width="2.5" filter="url(#sh)"/><text x="600" y="853" font-size="15.5" fill="#4e2a00" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">What does the</tspan><tspan x="600" dy="20.150000000000002">current do?</tspan></text>
<path d="M600 896 C600 920 240 910 240 930" fill="none" stroke="#0D2847" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#a0D2847)"/>
<rect x="80" y="934" width="320" height="92" rx="14" fill="#fff8e1" stroke="#ffcc80" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="240" y="958" font-size="16" fill="#E65100" font-weight="800" text-anchor="middle">Nothing moves</text>
<text x="240" y="982" font-size="13.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="240" dy="0">Power key line, VBAT</tspan><tspan x="240" dy="17.55">reaching the PMIC,</tspan><tspan x="240" dy="17.55">fuse or coil, PMIC</tspan></text>
<path d="M600 896 C600 920 600 910 600 930" fill="none" stroke="#0D2847" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#a0D2847)"/>
<rect x="440" y="934" width="320" height="92" rx="14" fill="#fff8e1" stroke="#ffcc80" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="600" y="958" font-size="16" fill="#E65100" font-weight="800" text-anchor="middle">Jumps, then 0</text>
<text x="600" y="982" font-size="13.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">PMIC rails in diode</tspan><tspan x="600" dy="17.55">mode, crystal,</tspan><tspan x="600" dy="17.55">CPU / PMIC</tspan></text>
<path d="M600 896 C600 920 960 910 960 930" fill="none" stroke="#0D2847" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="1" marker-end="url(#a0D2847)"/>
<rect x="800" y="934" width="320" height="92" rx="14" fill="#fff8e1" stroke="#ffcc80" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="960" y="958" font-size="16" fill="#E65100" font-weight="800" text-anchor="middle">Stuck or loops</text>
<text x="960" y="982" font-size="13.5" fill="#37474f" font-weight="400" text-anchor="middle"><tspan x="960" dy="0">Connect to PC. Detected?</tspan><tspan x="960" dy="17.55">Flash. Not detected?</tspan><tspan x="960" dy="17.55">Check storage and rails</tspan></text></svg>