<text x="700" y="468" font-size="17" fill="#E65100" font-weight="800" text-anchor="start">Chips (BGA)</text>
<text x="700" y="494" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">preheat the board, then 350–400 °C</text></svg>