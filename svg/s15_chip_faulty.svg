<marker id="a0D2847" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0D2847"/></marker><marker id="aE65100" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E65100"/></marker><marker id="a1565C0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1565C0"/></marker><marker id="a2E7D32" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aC62828" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C62828"/></marker><marker id="a6A1B9A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6A1B9A"/></marker><marker id="a00796B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00796B"/></marker><marker id="a546E7A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#546E7A"/></marker><marker id="a1d1d1f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f"/></marker><marker id="aff5722" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5722"/></marker><marker id="affffff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="600" fill="#fff"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Before you remove a chip: is it really the chip?</text>
<text x="40" y="84" font-size="17" fill="#55657a">Expensive and risky chip work should be the last step, not the first.</text>
<rect x="40" y="120" width="560" height="70" rx="14" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/>
<circle cx="76" cy="155" r="16" fill="#1565C0" stroke="#fff" stroke-width="2"/><text x="76" y="160.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="104" y="162" font-size="17" fill="#0D2847" font-weight="700" text-anchor="start">Are its power lines present (correct voltage)?</text>
<line x1="606" y1="155" x2="660" y2="155" stroke="#C62828" stroke-width="3" stroke-linecap="round" marker-end="url(#aC62828)"/>
<text x="672" y="162" font-size="16" fill="#C62828" font-weight="700" text-anchor="start">NO → fix that first; the chip may be fine</text>
<rect x="40" y="212" width="560" height="70" rx="14" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/>
<circle cx="76" cy="247" r="16" fill="#1565C0" stroke="#fff" stroke-width="2"/><text x="76" y="252.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="104" y="254" font-size="17" fill="#0D2847" font-weight="700" text-anchor="start">Is its clock or crystal working?</text>
<line x1="606" y1="247" x2="660" y2="247" stroke="#C62828" stroke-width="3" stroke-linecap="round" marker-end="url(#aC62828)"/>
<text x="672" y="254" font-size="16" fill="#C62828" font-weight="700" text-anchor="start">NO → fix that first; the chip may be fine</text>
<rect x="40" y="304" width="560" height="70" rx="14" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/>
<circle cx="76" cy="339" r="16" fill="#1565C0" stroke="#fff" stroke-width="2"/><text x="76" y="344.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="104" y="346" font-size="17" fill="#0D2847" font-weight="700" text-anchor="start">Do its enable and control signals arrive?</text>
<line x1="606" y1="339" x2="660" y2="339" stroke="#C62828" stroke-width="3" stroke-linecap="round" marker-end="url(#aC62828)"/>
<text x="672" y="346" font-size="16" fill="#C62828" font-weight="700" text-anchor="start">NO → fix that first; the chip may be fine</text>
<rect x="40" y="396" width="560" height="70" rx="14" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/>
<circle cx="76" cy="431" r="16" fill="#1565C0" stroke="#fff" stroke-width="2"/><text x="76" y="436.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<text x="104" y="438" font-size="17" fill="#0D2847" font-weight="700" text-anchor="start">Is nothing shorted around it?</text>
<line x1="606" y1="431" x2="660" y2="431" stroke="#C62828" stroke-width="3" stroke-linecap="round" marker-end="url(#aC62828)"/>
<text x="672" y="438" font-size="16" fill="#C62828" font-weight="700" text-anchor="start">NO → fix that first; the chip may be fine</text>
<rect x="40" y="500" width="560" height="70" rx="14" fill="#2E7D32" stroke="none" stroke-width="0" opacity="1" filter="url(#sh)"/>
<text x="320" y="543" font-size="18" fill="#fff" font-weight="800" text-anchor="middle">All YES, still no output</text>
<line x1="606" y1="535" x2="660" y2="535" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" marker-end="url(#a2E7D32)"/>
<text x="672" y="542" font-size="16" fill="#2E7D32" font-weight="800" text-anchor="start">Now suspect the chip: reflow or replace</text></svg>