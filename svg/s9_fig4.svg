<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64b5f6"/><stop offset="1" stop-color="#1e88e5"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1a2b" flood-opacity=".18"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1a2b" flood-opacity=".25"/></filter>
<marker id="a0D2847" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0D2847"/></marker><marker id="aE65100" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E65100"/></marker><marker id="a1565C0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1565C0"/></marker><marker id="a2E7D32" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aC62828" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C62828"/></marker><marker id="a6A1B9A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6A1B9A"/></marker><marker id="a00796B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00796B"/></marker><marker id="a546E7A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#546E7A"/></marker><marker id="a1d1d1f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d1d1f"/></marker><marker id="aff5722" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5722"/></marker><marker id="affffff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="800" fill="#fff"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 9.4  How a charger knows a phone is connected</text>
<text x="40" y="108" font-size="21" fill="#0D2847" font-weight="800" text-anchor="start">A.  USB-C to USB-C</text>
<rect x="40" y="130" width="320" height="300" rx="18" fill="#eceff1" stroke="#cfd8dc" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="200" y="166" font-size="16" fill="#0D2847" font-weight="800" text-anchor="middle">CHARGER (source)</text>
<rect x="840" y="130" width="320" height="300" rx="18" fill="#e3f2fd" stroke="#90caf9" stroke-width="2" opacity="1" filter="url(#sh)"/>
<text x="1000" y="166" font-size="16" fill="#0D2847" font-weight="800" text-anchor="middle">PHONE (sink)</text>
<text x="70" y="224" font-size="16" fill="#C62828" font-weight="800" text-anchor="start">5 V</text>
<line x1="105" y1="218" x2="140" y2="218" stroke="#C62828" stroke-width="3" stroke-linecap="round"/>
<circle cx="144" cy="218" r="5" fill="#fff" stroke="#1d1d1f" stroke-width="2"/>
<line x1="148" y1="216" x2="182" y2="200" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
<circle cx="186" cy="218" r="5" fill="#fff" stroke="#1d1d1f" stroke-width="2"/>
<line x1="190" y1="218" x2="880" y2="218" stroke="#C62828" stroke-width="3.5" stroke-linecap="round"/>
<text x="520" y="206" font-size="15" fill="#C62828" font-weight="800" text-anchor="middle">VBUS</text>
<text x="890" y="224" font-size="14" fill="#263238" font-weight="600" text-anchor="start">→ OVP → charging IC</text>
<text x="165" y="260" font-size="13" fill="#55657a" font-weight="400" text-anchor="middle"><tspan x="165" dy="0">VBUS switch</tspan><tspan x="165" dy="17.55">(OFF until the</tspan><tspan x="165" dy="17.55">phone is found)</tspan></text>
<line x1="250" y1="218" x2="250" y2="300" stroke="#6A1B9A" stroke-width="2.5" stroke-linecap="round"/>
<rect x="240" y="300" width="20" height="56" rx="2" fill="#fff" stroke="#6A1B9A" stroke-width="2.5" opacity="1"/>
<text x="270" y="334" font-size="14" fill="#6A1B9A" font-weight="700" text-anchor="start">Rp</text>
<path d="M250 356 L250 390 L920 390" fill="none" stroke="#6A1B9A" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="560" y="380" font-size="15" fill="#6A1B9A" font-weight="800" text-anchor="middle">CC (one wire in the cable)</text>
<line x1="920" y1="390" x2="990" y2="390" stroke="#6A1B9A" stroke-width="3.5" stroke-linecap="round"/>
<rect x="990" y="381" width="60" height="18" rx="2" fill="#fff" stroke="#6A1B9A" stroke-width="2" opacity="1"/>
<line x1="1050" y1="390" x2="1080" y2="390" stroke="#6A1B9A" stroke-width="3" stroke-linecap="round"/>
<line x1="1080" y1="390" x2="1080" y2="396" stroke="#6A1B9A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="1080" y1="396" x2="1080" y2="408" stroke="#6A1B9A" stroke-width="2" stroke-linecap="round"/><line x1="1066" y1="408" x2="1094" y2="408" stroke="#6A1B9A" stroke-width="2.5" stroke-linecap="round"/><line x1="1071" y1="414" x2="1089" y2="414" stroke="#6A1B9A" stroke-width="2.5" stroke-linecap="round"/><line x1="1076" y1="420" x2="1084" y2="420" stroke="#6A1B9A" stroke-width="2.5" stroke-linecap="round"/>
<text x="1020" y="370" font-size="14" fill="#6A1B9A" font-weight="700" text-anchor="middle">Rd 5.1 kΩ</text>
<text x="890" y="412" font-size="14" fill="#6A1B9A" font-weight="800" text-anchor="start">CC1</text>
<text x="1000" y="330" font-size="1" fill="#1d1d1f" font-weight="400" text-anchor="start"></text>
<circle cx="60" cy="470" r="13" fill="#6A1B9A" stroke="#fff" stroke-width="2"/><text x="60" y="474.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="84" y="476" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">The charger keeps VBUS OFF and watches the CC wire through its pull-up resistor Rp.</text>
<circle cx="60" cy="508" r="13" fill="#6A1B9A" stroke="#fff" stroke-width="2"/><text x="60" y="512.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="84" y="514" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">The phone's Rd (5.1 kΩ to ground) pulls the CC voltage down. The charger now knows a phone is there.</text>
<circle cx="60" cy="546" r="13" fill="#6A1B9A" stroke="#fff" stroke-width="2"/><text x="60" y="550.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="84" y="552" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">The charger switches VBUS on at 5 V. Rp also tells the phone how much current it may draw.</text>
<circle cx="60" cy="584" r="13" fill="#6A1B9A" stroke="#fff" stroke-width="2"/><text x="60" y="588.68" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<text x="84" y="590" font-size="15.5" fill="#263238" font-weight="400" text-anchor="start">Fast charging (USB PD): both sides talk over the CC wire and agree on 9 V, 12 V or more.</text>
<text x="40" y="642" font-size="15.5" fill="#C62828" font-weight="700" text-anchor="start">If the phone's Rd or the CC line is damaged, the charger never sees the phone and VBUS stays at 0 V.</text>
<line x1="40" y1="670" x2="1160" y2="670" stroke="#e3e8ef" stroke-width="2" stroke-linecap="round"/>
<text x="40" y="708" font-size="21" fill="#0D2847" font-weight="800" text-anchor="start">B.  USB-A charger (micro-USB cable, or A-to-C cable)</text>
<circle cx="52" cy="742" r="5" fill="#0D2847" stroke="none" stroke-width="2"/>
<text x="66" y="747" font-size="15" fill="#263238" font-weight="400" text-anchor="start">VBUS 5 V is always on. There is no CC check, so a phone with a damaged CC line may still charge from an A-to-C cable but not from C-to-C.</text>
<circle cx="52" cy="776" r="5" fill="#0D2847" stroke="none" stroke-width="2"/>
<text x="66" y="781" font-size="15" fill="#263238" font-weight="400" text-anchor="start">The phone checks D+ and D–: a wall charger shorts D+ to D– (up to about 1.5 A); a computer port gives about 0.5 A.</text>
<circle cx="52" cy="810" r="5" fill="#0D2847" stroke="none" stroke-width="2"/>
<text x="66" y="815" font-size="15" fill="#263238" font-weight="400" text-anchor="start">Older fast charging (Quick Charge and similar) uses voltages on D+ and D– to ask for 9 V or 12 V.</text></svg>