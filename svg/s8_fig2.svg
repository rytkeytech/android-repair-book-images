<text x="40" y="52" font-size="30" font-weight="700" fill="#0D2847">Figure 8.2  Where to measure on a no-power phone (simplified)</text>
<text x="40" y="84" font-size="17" fill="#55657a">Work along the numbers. The first reading that is wrong shows where the fault is.</text>
