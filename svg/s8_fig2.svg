<circle cx="800" cy="190" r="16" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="800" y="195.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<circle cx="800" cy="260" r="16" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="800" y="265.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">5</text>
<circle cx="700" cy="420" r="16" fill="#E65100" stroke="#fff" stroke-width="2"/><text x="700" y="425.4" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">6</text>

<text x="50" y="604" font-size="14.5" fill="#263238" font-weight="400" text-anchor="start">1.  VBAT at the connector: 3.7–4.2 V with the supply on</text>

<text x="50" y="638" font-size="14.5" fill="#263238" font-weight="400" text-anchor="start">2.  VBAT after the fuse or coil: same as 1 (0 V means the fuse or coil is open)</text>

<text x="50" y="672" font-size="14.5" fill="#263238" font-weight="400" text-anchor="start">3.  Power key line: voltage when released, drops to 0 when pressed</text>

<text x="620" y="604" font-size="14.5" fill="#263238" font-weight="400" text-anchor="start">4.  Buck outputs: diode mode not 0 (short) and not OL (open)</text>

<text x="620" y="638" font-size="14.5" fill="#263238" font-weight="400" text-anchor="start">5.  LDO outputs: same check as 4</text>

<text x="620" y="672" font-size="14.5" fill="#263238" font-weight="400" text-anchor="start">6.  Crystal: check for damage, corrosion or a cracked part</text></svg>